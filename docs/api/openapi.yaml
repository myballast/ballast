openapi: 3.1.0

# The contract of Ballast's HTTP API.
#
# Kept by hand, next to the code it describes, and checked against it:
# internal/adapter/http/openapi_test.go fails when a route registered in
# router.go is missing here, or when a route described here no longer exists.
# Any change to an endpoint updates this file in the same change.
#
# View it with `make api-docs`.

info:
  title: Ballast API
  version: 0.1.0
  description: |
    Load testing as a service. A signed-in user picks a scenario and a target
    environment, queues a run, and reads its results.

    **Authentication.** Every route except the health check and the sign-in flow
    requires the `ballast_session` cookie, which the sign-in flow sets. It is
    `HttpOnly`, so browser scripts cannot read it; the front end's server
    forwards it. A request without a valid session gets `401`.

    **Origin.** A request that carries an `Origin` header comes from a browser
    page, and is answered `403` for every route unless the origin is the front
    end's or the API's own; the front end's origin also gets the CORS headers
    (`Access-Control-Allow-Origin`, `Allow-Credentials`). A request with no
    `Origin` — the front end's server, a command line — is left to
    authentication. The session is also bound to the environment that issued it:
    a cookie from another environment is a `401`.

    **Tenancy.** The organization a request acts for is the one in the session.
    It is never read from the request itself. Identifiers that belong to another
    organization behave exactly like identifiers that do not exist.

servers:
  - url: http://localhost:8080
    description: Local development (`make dev`)

tags:
  - name: health
    description: Liveness of the API process. Does not touch the database.
  - name: auth
    description: Sign-in through an external identity provider. Ballast stores no password.
  - name: me
    description: The signed-in user and the organization their session acts for.
  - name: runs
    description: Queue load-test runs and read their results.
  - name: scenarios
    description: |
      Versioned k6 scripts. A script never hardcodes what it targets or how
      hard: it reads `__ENV.BASE_URL` and takes its load from the profile chosen
      at launch. Every version ever written is kept, because a run names the one
      it executed.
  - name: endpoints
    description: |
      The endpoints a project knows about, read from the specifications somebody
      imported. They let a scenario pick an endpoint instead of typing it. A
      catalog never holds a credential: `Authorization`, `Cookie` and the
      header of an API key are left out, whatever example the file gave them.
  - name: environments
    description: |
      Target environments: what a project is allowed to load, how hard, during
      which hours, and with which credentials. No run may be sent at a target
      whose ownership has not been proved and approved, and no endpoint ever
      returns the value of a secret.
  - name: projects
    description: |
      Projects, and who belongs to them. What a member may do is decided by
      their role, which is cumulative: `viewer`, then `runner`, then
      `maintainer`, then `admin`.

  - name: invitations
    description: |
      Bringing people into a project. No mail is sent: the administrator is shown
      a link once and passes it on. Only the hash of its token is stored.

security:
  - session: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /readyz:
    get:
      tags: [health]
      summary: Readiness check
      description: |
        Whether the API can do its work, which means whether the database
        answers. `/healthz` says the process is up; a platform that restarts on
        a failed liveness check would otherwise restart a healthy API because
        its database was briefly away.

        The reason for a refusal is not in the body. A driver's error names the
        host, the user and the database it was given, and this endpoint needs no
        session.
      operationId: ready
      security: []
      responses:
        "200":
          description: The database answered.
          content:
            text/plain:
              schema:
                type: string
                example: "ready\n"
        "503":
          description: The database could not be reached within two seconds.
          content:
            text/plain:
              schema:
                type: string
                example: "not ready\n"

  /auth/providers:
    get:
      tags: [auth]
      summary: List the identity providers one can sign in with
      description: Only the providers the API has credentials for are listed.
      operationId: listProviders
      security: []
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"

  /auth/{provider}/login:
    get:
      tags: [auth]
      summary: Start a sign-in
      description: |
        Meant for a browser navigation, not for `fetch`. Sets a short-lived
        `ballast_oauth` cookie holding the state and PKCE verifier, then
        redirects to the provider's authorization page.
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: next
          in: query
          required: false
          description: |
            Path on the front end to return to once signed in. Anything that is
            not a plain path (a scheme, a host, a leading `//`, a backslash) is
            replaced by `/`.
          schema:
            type: string
            example: /runs/5439bf02-f910-479f-8bb1-dc72ff319d53
      responses:
        "302":
          description: Redirect to the provider, with the state and an S256 PKCE challenge.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: "`ballast_oauth`: Path=/auth/, Max-Age=600, HttpOnly, Secure, SameSite=Lax."
              schema: { type: string }
        "404":
          description: No such provider, or it is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/{provider}/callback:
    get:
      tags: [auth]
      summary: Finish a sign-in
      description: |
        Where the provider sends the browser back. Must be registered as the
        OAuth application's callback URL.

        The state must match the one in the `ballast_oauth` cookie, which is
        cleared whatever happens. On the first sign-in an organization is
        created, with a first project the user administers.

        Every outcome is a redirect to the front end: to `next` on success, to
        `/login?error=<code>` otherwise. The codes are `invalid_request` (no
        matching sign-in was started in this browser), `denied` (refused at
        the provider) and `signin_failed`.
      operationId: callback
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: Set by the provider when the user refused.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the front end.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: |
                On success, `ballast_session`: Path=/, HttpOnly, Secure,
                SameSite=Lax, Max-Age set to the session lifetime. In every
                case, `ballast_oauth` expired.
              schema: { type: string }

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Expires the session cookie. A POST, so that a link on another site cannot sign anyone out.
      operationId: logout
      security: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: "`ballast_session` expired."
              schema: { type: string }

  /me:
    get:
      tags: [me]
      summary: Who is signed in
      description: |
        The signed-in user and the organization the session acts for. It is what
        the application shell shows: the user's name, and the organization in
        the organization selector.

        A session can outlive its user for the rest of its lifetime; if the user
        no longer exists, the answer is `401`, not `404`.
      operationId: getMe
      x-ballast-permission: none
      responses:
        "200":
          description: The signed-in user and their organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/organization:
    post:
      tags: [me]
      summary: Act for another organization
      description: |
        The same person, signed in to another organization they belong to. A
        person is a separate user in each organization; the identity provider's
        subject is what ties them together. The response sets a new session
        cookie for that organization.

        Refused with `403` for an organization the caller does not belong to,
        without saying whether it exists.
      operationId: switchOrganization
      x-ballast-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationRequest"
      responses:
        "204":
          description: Switched. The new session is in `Set-Cookie`.
        "400":
          description: The body is not valid JSON, or the id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller does not belong to that organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /roles:
    get:
      tags: [projects]
      summary: What each role may do
      description: |
        The permissions matrix: the capabilities, and for each of the four roles,
        least able first, the ones it holds. It is derived from the table the
        permission checks themselves use, so it cannot differ from what is
        enforced.
      operationId: listRoles
      x-ballast-permission: none
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"

    get:
      tags: [invitations]
      summary: Read an invitation link
      description: |
        What a link offers, read before anybody agrees to it: the organization,
        the project, the role and the address it was written for. Public, because
        the page has to say who is asking before the person it asks has signed
        in; the token is what proves they were given the link.

        A known token is described whatever became of it, with its `state`, so
        that the page can say what happened rather than that something did.
      operationId: getInvitation
      security: []
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: No such invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"

    post:
      tags: [invitations]
      summary: Accept an invitation
      description: |
        Makes the signed-in person a member of the project with the role the
        invitation names, and marks it used. The organization that invited them
        gets a user for them if it has none, found by the identity provider's
        subject. The response sets a session for that organization.

        The address on the invitation must be the one the person signed in with:
        the link is a credential for one address, and forwarded to somebody else
        it does not make them a member. That refusal is written to the journal.

        A person already in the project keeps the role they have.
      operationId: acceptInvitation
      x-ballast-permission: none
      responses:
        "200":
          description: Joined. The new session is in `Set-Cookie`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptedResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The invitation was written for another email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another user of the organization already holds this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The invitation was used, revoked, or has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /runs:
    post:
      tags: [runs]
      summary: Queue a run
      description: |
        Runs a scenario against an environment of the same project. The load
        is the profile's template unless `params` is given, and either way it
        is clamped to the environment's `max_vus` and `max_duration_s` before
        it is stored. The run is executed later by the worker.

        The load is clamped to the smaller of two ceilings: the environment's
        `max_vus` and `max_duration_s`, and the ones no configuration can
        raise — 200 virtual users and one hour. What the response carries is
        what will be executed, which may be less than what was asked for.

        Refused with `403` when the environment's ownership has not been
        verified, and when the environment declares an allowed window that the
        run does not fit inside — either because it is shut now, or because the
        run would still be generating load after it closes. The length compared
        is the clamped one. Both refusals are logged.
      operationId: enqueueRun
      x-ballast-permission: run_test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRunRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueRunResponse"
        "400":
          description: |
            The body is not valid JSON, an identifier is not a UUID, the
            profile is unknown or its parameters describe no runnable test, or
            the scenario and the environment belong to different projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The environment has not been verified, or its allowed window does not
            have room for this run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unverified:
                  value:
                    error: this environment has not been verified
                outsideWindow:
                  value:
                    error: "the environment accepts no load at this hour: it closes in 10m0s and the run would last 20m0s"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          description: |
            A limit nobody can raise from the outside was reached: too many runs
            triggered in the last hour by this person or by this organization,
            or too many already waiting.

            `Retry-After` carries the number of seconds to wait when that can be
            known — a rate window empties at a time arithmetic can give. It is
            absent when it cannot: a full queue empties as runs finish, and a
            number invented to fill the header would be worse than none.

            The message says which limit was reached and the figure reached. It
            never says how close anybody else is to theirs.
          headers:
            Retry-After:
              description: Seconds to wait before trying again, when it is known.
              required: false
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate:
                  value:
                    error: you have triggered 30 runs in the last 1h0m0s, which is the most allowed
                queue:
                  value:
                    error: this organization already has 20 runs waiting, which is the most it may queue
        "503":
          description: |
            This installation is not accepting new runs: somebody has thrown
            the platform's switch, and nothing about the request was even read.
            Runs already under way are unaffected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                suspended:
                  value:
                    error: Ballast is not accepting new runs

  /usage:
    get:
      tags: [runs]
      summary: What the organization moved in a month
      description: |
        The traffic of every run of the organization that ended inside the
        month, summed.

        Reserved to somebody who administers **every** project of the
        organization, as the emergency stop is: a figure about the whole
        organization is the whole organization's, and a partial total read as a
        total is worse than no total.
      operationId: readOrganizationUsage
      x-ballast-permission: manage_project
      parameters:
        - name: month
          in: query
          required: false
          description: |
            The month to sum, written as `YYYY-MM`. Defaults to the month now.
            Always UTC: a figure read as a cost must not depend on where the
            reader is.
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: The month's traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "400":
          description: month is not written as YYYY-MM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller does not administer every project of the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /runs/stop-all:
    post:
      tags: [runs]
      summary: Emergency stop
      description: |
        Cancels every queued run of the organization and asks every running one
        to stop. The two are counted separately because they are not the same
        thing: a queued run is over when this returns, and a running one is
        ended by the worker executing it, once that worker has destroyed the
        container — a couple of seconds later.

        Reserved to somebody who administers **every** project of the
        organization. The check is made project by project, and anything less is
        refused with `403` rather than given a stop that silently leaves part of
        the load running; cancelling run by run stays open to them.
      operationId: stopAllRuns
      x-ballast-permission: cancel_run
      responses:
        "200":
          description: What was stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopAllResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller does not administer every project of the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /runs/{id}:
    get:
      tags: [runs]
      summary: Read a run and its results
      description: |
        Metrics and threshold verdicts are empty until the run has finished.
        Verdicts are k6's own; Ballast never recomputes them.
      operationId: getRun
      x-ballast-permission: view_project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [runs]
      summary: Cancel a run
      description: |
        Stops a run that is queued or being executed.

        The two answers differ because the facts do. A queued run is cancelled
        by the time this returns — nothing had started, and it held no target —
        and the response is `200`. A run being executed has only been *asked* to
        stop: its generator is still loading the target for a second or two, so
        the response is `202`, and the run reaches `cancelled` when the worker
        executing it has destroyed the container and freed the target. A client
        watching for that reads `cancel_requested_at` on the run, which is set
        as soon as the request is recorded.

        A run that has already finished answers `409`: nothing about the request
        is wrong, there is simply nothing left to stop.
      operationId: cancelRun
      x-ballast-permission: cancel_run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run was queued and is now cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunResponse"
              example:
                id: 8f14e45f-ceea-467a-9e2a-3f1f0f5b1f11
                status: cancelled
                outcome: cancelled
        "202":
          description: |
            The run is being executed and has been asked to stop. It is ended by
            the worker executing it, within a few seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunResponse"
              example:
                id: 8f14e45f-ceea-467a-9e2a-3f1f0f5b1f11
                status: running
                outcome: cancellation_requested
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run has already finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                finished:
                  value:
                    error: this run has already finished
        "500":
          $ref: "#/components/responses/InternalError"

  /runs/{id}/rerun:
    post:
      tags: [runs]
      summary: Repeat a run
      description: |
        Queues a new run with what the run being repeated froze: the same
        scenario **at the same version**, the same profile and parameters, and the
        same environment. They are read from that run, and never from what the
        scenario or its defaults are today — editing a scenario after a run does
        not change what repeating the run repeats.

        The new run is a new run in every other respect, and goes through
        everything `POST /runs` goes through: the platform's switch, the limits,
        the permission to run tests, the verification of the target, the hours it
        accepts load, and the ceilings it was declared with. An environment that
        has been lowered or revoked since is a reason to lower the load or to
        refuse; repeating a run is no way round it. What the response carries is
        what will be executed, which may be less than the earlier run asked for.

        Two things are not frozen and are therefore today's: the thresholds, which
        belong to the scenario and not to a version of it, and the environment's
        secrets.

        The journal's `run.queued` entry carries `rerun_of`, the run repeated.
      operationId: rerunRun
      x-ballast-permission: run_test
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueRunResponse"
        "400":
          description: |
            The id is not a UUID, or the earlier run's load no longer describes a
            runnable test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The caller may read the run and may not run tests in its project, the
            environment is no longer verified, or its allowed window does not have
            room for the run. The attempt is logged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: A limit was reached, as for `POST /runs`.
          headers:
            Retry-After:
              description: Seconds to wait before trying again, when it is known.
              required: false
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: This installation is not accepting new runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/logs:
    get:
      tags: [runs]
      summary: Follow a run's output
      description: |
        The lines a run's generator wrote, as Server-Sent Events
        (`text/event-stream`). Opened while the run is under way, the stream
        sends everything written so far and then keeps sending as the run
        writes; opened after it finished, it sends the whole output and ends.

        Three kinds of event:

        - `line` — one line of output. Its `id` is the line's sequence number,
          and the data is a `LogLine`.
        - `end` — the run is over; the data is a `RunEnded` saying how. A client
          that receives it should not reconnect.
        - `error` — the stream stopped for a reason that arrived after the
          response had begun, so it could not be a status code.

        A comment line (`: keep-alive`) is sent every fifteen seconds down an
        idle stream, so that whatever sits in between does not decide the
        connection is dead.

        **Resuming.** Every `line` event carries its sequence number as the
        event id, so a browser reconnecting sends `Last-Event-ID` and receives
        what follows — no line twice and none skipped. A client that sends no
        such header is given the run from its first line.

        Nothing a run's own credentials consist of reaches these lines: the
        values of the environment's secrets, and any `Authorization`, `Cookie`
        or `Set-Cookie` header a script printed, are replaced with `[redacted]`
        before a line is ever stored.
      operationId: followRunLogs
      x-ballast-permission: view_project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          required: false
          description: |
            The sequence number of the last line the client already holds. Sent
            by a browser's EventSource on its own when it reconnects. An absent
            or unreadable value means the run is sent from its first line.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 0
                event: line
                data: {"seq":0,"stream":"stdout","message":"  ✓ status is 200","at":"2026-10-12T09:00:00Z"}

                : keep-alive

                event: end
                data: {"status":"passed"}
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects:
    get:
      tags: [projects]
      summary: List the caller's projects
      description: |
        The projects the caller is a member of, and no others. This is not a
        permission check: a project they do not belong to is simply not theirs,
        and does not appear.
      operationId: listProjects
      x-ballast-permission: none
      responses:
        "200":
          description: The projects, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [projects]
      summary: Create a project
      description: |
        The caller becomes the new project's `admin`.

        Requires `admin` in at least one project of the organization. There is
        no organization-wide role: every permission in Ballast is held within a
        project, so the nearest rule that stays scoped is that the caller
        already administers something here.
      operationId: createProject
      x-ballast-permission: manage_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The body is not valid JSON, or the name or slug is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another project already uses that slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: Read a project
      operationId: getProject
      x-ballast-permission: view_project
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [projects]
      summary: Edit a project
      description: |
        The display name and the details a person says about the project — where
        it runs, who answers for it, what it is made of. The slug does not move:
        it appears in URLs and in object storage keys, where changing it would
        orphan what is already filed under it.

        Requires `admin`.
      operationId: updateProject
      x-ballast-permission: manage_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The edited project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The body is not valid JSON, the id is not a UUID, or the name or a detail is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Delete a project
      description: |
        Refused with `409` while the project holds any run. Its rows cascade, so
        deleting it would take the whole run history with it, and that is not
        recoverable.

        Requires `admin`.
      operationId: deleteProject
      x-ballast-permission: manage_project
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The project still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: this project still holds runs; deleting it would take their history with it
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/favorite:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    put:
      tags: [projects]
      summary: Star a project
      description: |
        The caller's own star, which puts the project first in their list. It is
        theirs alone: nobody else sees it, and it grants and changes nothing, so
        belonging to the project is all it takes. Starring twice is the same as
        once.
      operationId: favoriteProject
      x-ballast-permission: view_project
      responses:
        "204":
          description: Starred.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Unstar a project
      description: |
        Takes back the caller's own star. Unstarring a project that is not
        starred is not an error, and nobody else's star is touched.
      operationId: unfavoriteProject
      x-ballast-permission: view_project
      responses:
        "204":
          description: Not starred any more.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: What the caller holds in a project
      description: |
        The caller's role in the project and the permissions they actually
        hold, by name, read from the database at the moment of asking. A mask
        stored on the membership replaces the role's; `custom` says when it does.

        This is what a client hides buttons by. It decides nothing: every
        request is still authorized on its own.

        It requires no permission, since it only describes the caller to
        themselves. A caller who is not a member is told the project is not
        found.
      operationId: getProjectPermissions
      x-ballast-permission: none
      responses:
        "200":
          description: The caller's access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/usage:
    get:
      tags: [projects]
      summary: What one project moved in a month
      description: |
        The traffic of every run of this project that ended inside the month,
        summed. Reserved to an administrator of the project: running tests in a
        project is not the same as answering for what it costs.
      operationId: readProjectUsage
      x-ballast-permission: manage_project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          description: |
            The month to sum, written as `YYYY-MM`. Defaults to the month now.
            Always UTC: a figure read as a cost must not depend on where the
            reader is.
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
      responses:
        "200":
          description: The month's traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "400":
          description: The project id is not a UUID, or month is not written as YYYY-MM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller is not an administrator of this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/audit:
    get:
      tags: [projects]
      summary: Read a project's journal
      description: |
        Who did what, to which target, with what result, and when — newest
        first. Refusals as much as successes: an attempt to send load at a
        target nobody verified is exactly what this records, and nothing else
        records it, because nothing else happened.

        What it holds: runs queued and runs refused, cancellations, emergency
        stops, targets proved and approved, roles granted and revoked.

        Entries with no `project_id` belong to the organization rather than to
        any project — an emergency stop is one — and appear in every project's
        journal: an action on the organization concerns each of its projects.
        Entries with no `actor_id` were caused by Ballast itself, with nobody
        behind them: a worker refusing at the last moment a run that was
        accepted hours earlier.

        Reserved to an administrator of the project. The journal is the record
        people are held to, and reading it is a different thing from taking
        part in the project.

        Nothing here ever carries a secret, a token, a verification challenge
        or a header: `details` holds a small set of keys chosen per action.
      operationId: readProjectAudit
      x-ballast-permission: manage_project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: |
            How many entries to return, newest first. Defaults to 100 and is
            capped at 500: a journal only grows, so no reading is the whole of
            it.
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          description: The project id is not a UUID, or limit is not a positive whole number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller is not an administrator of this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: List a project's members
      operationId: listMembers
      x-ballast-permission: view_project
      responses:
        "200":
          description: The members, by email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: userId
        in: path
        required: true
        description: A user of the caller's organization.
        schema: { type: string, format: uuid }

    put:
      tags: [projects]
      summary: Grant or change a role
      description: |
        Adds the user to the project, or changes the role they already hold.

        Refused with `409` when it would leave the project with no
        administrator, including when the caller is demoting themselves: a
        project nobody can administer cannot be repaired through this API.

        Requires `admin`.
      operationId: setMemberRole
      x-ballast-permission: manage_members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleRequest"
      responses:
        "204":
          description: The role is set.
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the role is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The project would be left with no administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Remove a member
      description: |
        Refused with `409` when it would leave the project with no
        administrator.

        Requires `admin`.
      operationId: removeMember
      x-ballast-permission: manage_members
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: This user is not a member of this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The project would be left with no administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [invitations]
      summary: List the open invitations of a project
      description: |
        The invitations that were neither used nor revoked, newest first. Expired
        ones are listed too, so that they can be revoked or replaced. The token
        is never returned: it was shown once, when the invitation was created.

        Requires `admin`.
      operationId: listInvitations
      x-ballast-permission: manage_members
      responses:
        "200":
          description: The open invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [invitations]
      summary: Invite somebody
      description: |
        Writes an invitation for an address and returns the token **once**: only
        its hash is stored. Nothing is sent; the caller passes the link on. It is
        good for seven days and for one use.

        An address that already belongs to a user of the organization is added to
        the project at once, with `200` and no token: an invitation would only
        ask them to prove what Ballast already knows.

        The caller can give up to their own role and no higher; a refusal is
        written to the journal.

        Requires `admin`.
      operationId: createInvitation
      x-ballast-permission: manage_members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Invited. The token is in the body, and only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreatedResponse"
        "200":
          description: The address already belonged to a user of the organization; they were added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAddedResponse"
        "400":
          description: The body is not valid JSON, the id is not a UUID, the address is not one, or the role is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The address already has a pending invitation, or the person already belongs to the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }

    delete:
      tags: [invitations]
      summary: Revoke an invitation
      description: |
        Withdraws an invitation that has not been used. The link stops working at
        once. Written to the journal.

        Requires `admin`.
      operationId: revokeInvitation
      x-ballast-permission: manage_members
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such open invitation in this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/endpoints:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [endpoints]
      summary: List a project's catalog of endpoints
      description: |
        Tagged endpoints first, then by tag, path and method. `q` is looked for as
        a plain substring, whatever the case, in the method, the path, the summary
        and the tag: nothing in it is read as a pattern.
      operationId: listCatalogEndpoints
      x-ballast-permission: view_project
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: tag
          in: query
          description: Only the endpoints of this tag. An empty value means all.
          schema: { type: string }
        - name: source
          in: query
          description: Only the endpoints imported from this source.
          schema: { type: string }
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [endpoints]
      summary: Remove every endpoint a source brought
      operationId: deleteCatalogSource
      x-ballast-permission: manage_scenarios
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: How many endpoints were removed. Zero when the source had none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRemovedResponse"
        "400":
          description: The source has no name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/endpoints/import/postman:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    post:
      tags: [endpoints]
      summary: Add requests of a Postman collection to the catalog
      description: |
        Reads the files under the same limits as the scenario import, and replaces
        **what the source already had** with the chosen requests, in one
        transaction. The folder of a request is kept as its tag and its name as
        its summary.

        The catalog keeps what is not a secret: no `Authorization`, `Cookie` or
        API-key header, no header named like a secret, and no body that held one.
        A request with the same method and path as an earlier one is kept once, and
        `findings` says so. A catalog has no limit of 199 requests, only its own of
        5000 endpoints.
      operationId: importPostmanToCatalog
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCollectionImportRequest"
      responses:
        "201":
          description: How many endpoints the source now has.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCollectionImportResponse"
        "400":
          description: The body is not valid JSON, the source has no usable name, or the catalog would pass its limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The request is larger than Ballast reads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            A file was refused, the choice is empty or names a request the
            collection does not have, or none of the chosen requests can become an
            endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/import/har/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    post:
      tags: [scenarios]
      summary: Read a HAR file and list its requests
      description: |
        The first half of importing a HAR file, the recording a browser makes of its
        requests. Every request is listed, in the order recorded, with the host it was
        sent to and what the browser used it for (`kind`): the screen filters on them,
        and only `api` — XHR and fetch calls — is ticked by default. Nothing is stored
        and nothing is kept on the server: the import sends the file again.

        The file is untrusted input and is bounded: at most 25 MB and 5000 requests. The
        responses, most of the file, are skipped while reading and never kept.

        The headers a browser sets for itself (`User-Agent`, `Sec-*`, `Referer`…) are left
        out and cookies are removed; `findings` says how many.
      operationId: previewHarImport
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HARPreviewRequest"
      responses:
        "200":
          description: The requests of the file, in the order recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPreviewResponse"
        "400":
          description: The body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The request is larger than Ballast reads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            A file was refused, with the reason: too large, not JSON, not a HAR file, too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/import/har:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    post:
      tags: [scenarios]
      summary: Create a graph scenario from chosen requests of a HAR file
      description: |
        The second half of importing a HAR file. The file is read again, under the
        same limits as the preview, and a scenario with `mode: graph` is created with one
        request per chosen request, in the order given. A scenario sends its load to one
        target: a chosen request to another host than the first is left out and reported.

        No cookie and no token of the file reaches the graph. The `Cookie` and
        `Set-Cookie` headers are removed and their values are not kept; an
        `Authorization` header, a token in the query or in a JSON or form body becomes a
        variable the generated script reads from the environment at run time, and the
        response lists the environment keys to create, without values. As a last step the
        import looks for every secret value and every removed cookie value of the file in
        everything it is about to store, and is refused with `422` if one is there.
      operationId: importHarScenario
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportHARRequest"
      responses:
        "201":
          description: Created, as version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCollectionResponse"
        "400":
          description: |
            The body is not valid JSON, or the name or the load is refused, or the
            `mode` is unknown, or a `script` was sent for a `graph` scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another scenario of this project already uses that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request is larger than Ballast reads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            A file was refused, the choice is empty or names a request the file does not
            have, none of the chosen requests can be made, or they need more nodes than a
            scenario holds. When the generated script itself was refused, `findings` says why.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  findings:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScriptFinding"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/import/curl/preview:
