openapi: 3.1.0

# The contract of Ballast's HTTP API.
#
# Kept by hand, next to the code it describes, and checked against it:
# internal/adapter/http/openapi_test.go fails when a route registered in
# router.go is missing here, or when a route described here no longer exists.
# Any change to an endpoint updates this file in the same change.
#
# View it with `make api-docs`.

info:
  title: Ballast API
  version: 0.1.0
  description: |
    Load testing as a service. A signed-in user picks a scenario and a target
    environment, queues a run, and reads its results.

    **Authentication.** Every route except the health check and the sign-in flow
    requires the `ballast_session` cookie, which the sign-in flow sets. It is
    `HttpOnly`, so browser scripts cannot read it; the front end's server
    forwards it. A request without a valid session gets `401`.

    **Tenancy.** The organization a request acts for is the one in the session.
    It is never read from the request itself. Identifiers that belong to another
    organization behave exactly like identifiers that do not exist.

servers:
  - url: http://localhost:8080
    description: Local development (`make dev`)

tags:
  - name: health
    description: Liveness of the API process. Does not touch the database.
  - name: auth
    description: Sign-in through an external identity provider. Ballast stores no password.
  - name: runs
    description: Queue load-test runs and read their results.
  - name: scenarios
    description: |
      Versioned k6 scripts. A script never hardcodes what it targets or how
      hard: it reads `__ENV.BASE_URL` and takes its load from the profile chosen
      at launch. Every version ever written is kept, because a run names the one
      it executed.
  - name: projects
    description: |
      Projects, and who belongs to them. What a member may do is decided by
      their role, which is cumulative: `viewer`, then `runner`, then
      `maintainer`, then `admin`.

security:
  - session: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /auth/providers:
    get:
      tags: [auth]
      summary: List the identity providers one can sign in with
      description: Only the providers the API has credentials for are listed.
      operationId: listProviders
      security: []
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"

  /auth/{provider}/login:
    get:
      tags: [auth]
      summary: Start a sign-in
      description: |
        Meant for a browser navigation, not for `fetch`. Sets a short-lived
        `ballast_oauth` cookie holding the state and PKCE verifier, then
        redirects to the provider's authorization page.
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: next
          in: query
          required: false
          description: |
            Path on the front end to return to once signed in. Anything that is
            not a plain path (a scheme, a host, a leading `//`, a backslash) is
            replaced by `/`.
          schema:
            type: string
            example: /runs/5439bf02-f910-479f-8bb1-dc72ff319d53
      responses:
        "302":
          description: Redirect to the provider, with the state and an S256 PKCE challenge.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: "`ballast_oauth`: Path=/auth/, Max-Age=600, HttpOnly, Secure, SameSite=Lax."
              schema: { type: string }
        "404":
          description: No such provider, or it is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/{provider}/callback:
    get:
      tags: [auth]
      summary: Finish a sign-in
      description: |
        Where the provider sends the browser back. Must be registered as the
        OAuth application's callback URL.

        The state must match the one in the `ballast_oauth` cookie, which is
        cleared whatever happens. On the first sign-in an organization is
        created, with a first project the user administers.

        Every outcome is a redirect to the front end: to `next` on success, to
        `/login?error=<code>` otherwise. The codes are `invalid_request` (no
        matching sign-in was started in this browser), `denied` (refused at
        the provider) and `signin_failed`.
      operationId: callback
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: Set by the provider when the user refused.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the front end.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: |
                On success, `ballast_session`: Path=/, HttpOnly, Secure,
                SameSite=Lax, Max-Age set to the session lifetime. In every
                case, `ballast_oauth` expired.
              schema: { type: string }

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Expires the session cookie. A POST, so that a link on another site cannot sign anyone out.
      operationId: logout
      security: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: "`ballast_session` expired."
              schema: { type: string }

  /runs:
    post:
      tags: [runs]
      summary: Queue a run
      description: |
        Runs a scenario against an environment of the same project. The load
        is the profile's template unless `params` is given, and either way it
        is clamped to the environment's `max_vus` and `max_duration_s` before
        it is stored. The run is executed later by the worker.

        Refused with `403` when the environment's ownership has not been
        verified; the attempt is logged.
      operationId: enqueueRun
      x-ballast-permission: run_test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRunRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueRunResponse"
        "400":
          description: |
            The body is not valid JSON, an identifier is not a UUID, the
            profile is unknown or its parameters describe no runnable test, or
            the scenario and the environment belong to different projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The environment has not been verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: this environment has not been verified
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /runs/{id}:
    get:
      tags: [runs]
      summary: Read a run and its results
      description: |
        Metrics and threshold verdicts are empty until the run has finished.
        Verdicts are k6's own; Ballast never recomputes them.
      operationId: getRun
      x-ballast-permission: view_project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects:
    get:
      tags: [projects]
      summary: List the caller's projects
      description: |
        The projects the caller is a member of, and no others. This is not a
        permission check: a project they do not belong to is simply not theirs,
        and does not appear.
      operationId: listProjects
      x-ballast-permission: none
      responses:
        "200":
          description: The projects, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [projects]
      summary: Create a project
      description: |
        The caller becomes the new project's `admin`.

        Requires `admin` in at least one project of the organization. There is
        no organization-wide role: every permission in Ballast is held within a
        project, so the nearest rule that stays scoped is that the caller
        already administers something here.
      operationId: createProject
      x-ballast-permission: manage_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The body is not valid JSON, or the name or slug is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another project already uses that slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: Read a project
      operationId: getProject
      x-ballast-permission: view_project
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [projects]
      summary: Rename a project
      description: |
        Only the display name moves. The slug does not: it appears in URLs and
        in object storage keys, where changing it would orphan what is already
        filed under it.

        Requires `admin`.
      operationId: updateProject
      x-ballast-permission: manage_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The renamed project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The body is not valid JSON, the id is not a UUID, or the name is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Delete a project
      description: |
        Refused with `409` while the project holds any run. Its rows cascade, so
        deleting it would take the whole run history with it, and that is not
        recoverable.

        Requires `admin`.
      operationId: deleteProject
      x-ballast-permission: manage_project
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The project still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: this project still holds runs; deleting it would take their history with it
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: List a project's members
      operationId: listMembers
      x-ballast-permission: view_project
      responses:
        "200":
          description: The members, by email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: userId
        in: path
        required: true
        description: A user of the caller's organization.
        schema: { type: string, format: uuid }

    put:
      tags: [projects]
      summary: Grant or change a role
      description: |
        Adds the user to the project, or changes the role they already hold.

        Refused with `409` when it would leave the project with no
        administrator, including when the caller is demoting themselves: a
        project nobody can administer cannot be repaired through this API.

        Requires `admin`.
      operationId: setMemberRole
      x-ballast-permission: manage_members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleRequest"
      responses:
        "204":
          description: The role is set.
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the role is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The project would be left with no administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Remove a member
      description: |
        Refused with `409` when it would leave the project with no
        administrator.

        Requires `admin`.
      operationId: removeMember
      x-ballast-permission: manage_members
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: This user is not a member of this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The project would be left with no administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [scenarios]
      summary: List a project's scenarios
      description: Without their scripts. Read one to get its script.
      operationId: listScenarios
      x-ballast-permission: view_project
      responses:
        "200":
          description: The scenarios, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [scenarios]
      summary: Import a scenario
      description: |
        The script is inspected before it is stored, and refused with `422` when
        it exports its own `options`, addresses a host of its own, or never reads
        `__ENV.BASE_URL`. The response then lists what was wrong.

        A script whose requests carry no `name` tag is accepted and comes back
        with a warning: without them every endpoint is measured as one, and a
        threshold cannot single one out.
      operationId: createScenario
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioRequest"
      responses:
        "201":
          description: Created, as version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The body is not valid JSON, or the name or the load is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another scenario of this project already uses that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ScriptRefused"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: Read a scenario
      description: |
        With its current script, and the warnings inspecting it raises. Those are
        worth reading before launching a run.
      operationId: getScenario
      x-ballast-permission: view_project
      responses:
        "200":
          description: The scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [scenarios]
      summary: Change a scenario
      description: |
        Anything left out stays as it is.

        Changing the script writes a **new version** and overwrites nothing. Runs
        already recorded keep pointing at the version they executed, and that
        version can still be read back.

        Renaming writes no version: a name is not something a run executed.
      operationId: updateScenario
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: The scenario, at its new version if the script changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the name or load is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ScriptRefused"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [scenarios]
      summary: Delete a scenario
      description: |
        Refused with `409` while the scenario holds any run: its rows cascade, so
        deleting it would take their history with it.
      operationId: deleteScenario
      x-ballast-permission: manage_scenarios
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The scenario still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: List a scenario's versions
      description: |
        Newest first. This is how the script a past run executed is read back: a
        run carries `scenario_version`, and nothing ever overwrites one.
      operationId: listScenarioVersions
      x-ballast-permission: view_project
      responses:
        "200":
          description: Every version ever written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioVersionListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/thresholds:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: List a scenario's thresholds
      operationId: listThresholds
      x-ballast-permission: view_project
      responses:
        "200":
          description: The rules this scenario imposes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [scenarios]
      summary: Impose a threshold
      description: |
        The metric accepts k6's tagged syntax, so a rule can single out one
        endpoint: `http_req_duration{name:POST /login}`.

        What the expression means is k6's to judge. Ballast reads the verdict of
        each threshold from the run's summary and never recomputes it.
      operationId: createThreshold
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThresholdRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdRule"
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the rule is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This scenario already imposes that rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/thresholds/{thresholdId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"
      - name: thresholdId
        in: path
        required: true
        schema: { type: string, format: uuid }

    delete:
      tags: [scenarios]
      summary: Drop a threshold
      description: |
        Runs already recorded keep their verdicts: those were frozen onto the run
        when it finished, and nothing here touches them.
      operationId: deleteThreshold
      x-ballast-permission: manage_scenarios
      responses:
        "204":
          description: Dropped.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ballast_session
      description: |
        A JWT set by the sign-in flow. It names the user and the organization
        and carries no permission.

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [github, google]

    ScenarioID:
      name: scenarioId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProjectID:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ScriptRefused:
      description: |
        The script was refused, with what was wrong with it. Every fault is
        listed, so it can be fixed in one pass.
      content:
        application/json:
          schema:
            type: object
            required: [error, findings]
            properties:
              error: { type: string }
              findings:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptFinding"

    Forbidden:
      description: |
        The caller's role does not allow this. A project they are not a member
        of answers the same way as one that does not exist: telling the two
        apart would reveal that it exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: you do not have permission to do that here

    MalformedID:
      description: An identifier in the path is not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: sign in to continue
    NotFound:
      description: |
        Nothing with this identifier exists in the caller's organization —
        whether it does not exist at all or belongs to another organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Something failed. The details are in the server's logs, never in the response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: something went wrong

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Role:
      type: string
      description: |
        Cumulative: each role grants everything the one before it does.

        - `viewer` reads the project and what its runs measured
        - `runner` also queues and stops runs
        - `maintainer` also edits scenarios, thresholds and environments
        - `admin` also approves targets, manages members, renames and deletes
      enum: [viewer, runner, maintainer, admin]

    Project:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: |
            Appears in URLs and in object storage keys, and never changes after
            creation.
        created_at: { type: string, format: date-time }

    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      example:
        name: Checkout service
        slug: checkout

    UpdateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }

    Member:
      type: object
      required: [user_id, email, role, has_custom_permissions, created_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        has_custom_permissions:
          type: boolean
          description: |
            A set of permissions stored against this membership, which replaces
            the role's rather than adding to it. Nothing in Ballast writes one;
            it is reported so that the role shown here is never mistaken for the
            whole story.
        created_at: { type: string, format: date-time }

    MemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    SetMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    ScriptFindingCode:
      type: string
      description: |
        - `unparsable` — k6 would not load it either
        - `declares_options` — the script exports its own options, which Ballast
          never consults: the load comes from the profile, which is what makes
          the environment's ceilings binding
        - `no_base_url` — the script never reads `__ENV.BASE_URL`
        - `hardcoded_url` — an absolute URL written into the script, which would
          reach a host no environment vouched for
        - `no_request_name_tags` — a warning: several requests, none tagged
      enum:
        - unparsable
        - declares_options
        - no_base_url
        - hardcoded_url
        - no_request_name_tags

    ScriptFinding:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ScriptFindingCode"
        message:
          type: string
          description: Wording may change; key on the code.
        detail: { type: string }
        line:
          type: integer
          description: Counting from one. Absent when the finding is about the whole script.

    ScenarioSummary:
      type: object
      required: [id, name, version, default_profile, default_params, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        version:
          type: integer
          minimum: 1
          description: The current version. Every earlier one is still readable.
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScenarioListResponse:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioSummary"

    Scenario:
      allOf:
        - $ref: "#/components/schemas/ScenarioSummary"
        - type: object
          required: [script, warnings]
          properties:
            script: { type: string }
            warnings:
              type: array
              description: Worth reading before launching a run. Never a reason the request failed.
              items:
                $ref: "#/components/schemas/ScriptFinding"

    CreateScenarioRequest:
      type: object
      required: [name, script]
      properties:
        name: { type: string, maxLength: 120 }
        script:
          type: string
          description: A k6 script reading `__ENV.BASE_URL`, exporting no options of its own.
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"

    UpdateScenarioRequest:
      type: object
      description: Anything left out stays as it is.
      properties:
        name: { type: string, maxLength: 120 }
        script: { type: string }
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"

    ScenarioVersion:
      type: object
      required: [version, script, default_profile, default_params, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        script: { type: string }
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"
        created_by:
          type: string
          format: uuid
          description: Absent once the person who wrote it has been removed.
        created_at: { type: string, format: date-time }

    ScenarioVersionListResponse:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioVersion"

    # The rule a scenario imposes, as distinct from Threshold below, which is
    # k6's verdict on it for one run.
    ThresholdRule:
      type: object
      required: [id, metric, expression]
      properties:
        id: { type: string, format: uuid }
        metric:
          type: string
          maxLength: 200
          description: k6's tagged syntax is accepted, e.g. `http_req_duration{name:POST /login}`.
        expression: { type: string, maxLength: 120 }
      example:
        id: 7a1f1e6e-0000-4000-8000-000000000001
        metric: http_req_duration{name:POST /login}
        expression: p(95)<300

    ThresholdListResponse:
      type: object
      required: [thresholds]
      properties:
        thresholds:
          type: array
          items:
            $ref: "#/components/schemas/ThresholdRule"

    CreateThresholdRequest:
      type: object
      required: [metric, expression]
      properties:
        metric: { type: string, maxLength: 200 }
        expression: { type: string, maxLength: 120 }

    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: string
            enum: [github, google]

    ProfileKind:
      type: string
      enum: [smoke, load, stress, spike, soak]

    ProfileParams:
      type: object
      description: The shape of the load, in whole seconds. The total duration must be at least one second.
      required: [target_vus, ramp_up_s, plateau_s, ramp_down_s]
      properties:
        target_vus: { type: integer, minimum: 1 }
        ramp_up_s: { type: integer, minimum: 0 }
        plateau_s: { type: integer, minimum: 0 }
        ramp_down_s: { type: integer, minimum: 0 }

    EnqueueRunRequest:
      type: object
      required: [scenario_id, environment_id, profile]
      properties:
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
      example:
        scenario_id: 00000000-0000-4000-8000-000000000003
        environment_id: 00000000-0000-4000-8000-000000000004
        profile: smoke

    EnqueueRunResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/RunStatus"

    RunStatus:
      type: string
      description: "`orphaned` is not terminal: the worker died mid-run and the run still has to be cleaned up."
      enum: [queued, running, passed, failed, errored, timeout, cancelled, rejected, skipped, orphaned]

    RunResponse:
      type: object
      required:
        - id
        - project_id
        - scenario_id
        - environment_id
        - scenario_version
        - profile
        - params
        - status
        - created_at
        - metrics
        - thresholds
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        scenario_version:
          type: integer
          description: The version of the scenario that was run, frozen on the run.
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
        status:
          $ref: "#/components/schemas/RunStatus"
        error_message:
          type: string
          description: Why the run errored, when it did.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        thresholds:
          type: array
          items:
            $ref: "#/components/schemas/Threshold"

    Metric:
      type: object
      description: One number k6 measured.
      required: [metric, stat, value]
      properties:
        metric:
          type: string
          example: http_req_duration
        tag:
          type: string
          description: The sub-metric's tag selector, absent for the metric itself.
          example: "expected_response:true"
        stat:
          type: string
          description: avg, min, med, max, p(90), p(95), p(99) for a trend; rate, count… otherwise.
          example: p(95)
        value:
          type: number
          description: Milliseconds for durations, a ratio between 0 and 1 for rates.

    Threshold:
      type: object
      description: k6's verdict on one rule of the scenario.
      required: [metric, expression, passed]
      properties:
        metric:
          type: string
          example: http_req_duration
        expression:
          type: string
          example: p(95)<2000
        passed:
          type: boolean
