openapi: 3.1.0

# The contract of Ballast's HTTP API.
#
# Kept by hand, next to the code it describes, and checked against it:
# internal/adapter/http/openapi_test.go fails when a route registered in
# router.go is missing here, or when a route described here no longer exists.
# Any change to an endpoint updates this file in the same change.
#
# View it with `make api-docs`.

info:
  title: Ballast API
  version: 0.1.0
  description: |
    Load testing as a service. A signed-in user picks a scenario and a target
    environment, queues a run, and reads its results.

    **Authentication.** Every route except the health check and the sign-in flow
    requires the `ballast_session` cookie, which the sign-in flow sets. It is
    `HttpOnly`, so browser scripts cannot read it; the front end's server
    forwards it. A request without a valid session gets `401`.

    **Tenancy.** The organization a request acts for is the one in the session.
    It is never read from the request itself. Identifiers that belong to another
    organization behave exactly like identifiers that do not exist.

servers:
  - url: http://localhost:8080
    description: Local development (`make dev`)

tags:
  - name: health
    description: Liveness of the API process. Does not touch the database.
  - name: auth
    description: Sign-in through an external identity provider. Ballast stores no password.
  - name: me
    description: The signed-in user and the organization their session acts for.
  - name: runs
    description: Queue load-test runs and read their results.
  - name: scenarios
    description: |
      Versioned k6 scripts. A script never hardcodes what it targets or how
      hard: it reads `__ENV.BASE_URL` and takes its load from the profile chosen
      at launch. Every version ever written is kept, because a run names the one
      it executed.
  - name: environments
    description: |
      Target environments: what a project is allowed to load, how hard, during
      which hours, and with which credentials. No run may be sent at a target
      whose ownership has not been proved and approved, and no endpoint ever
      returns the value of a secret.
  - name: projects
    description: |
      Projects, and who belongs to them. What a member may do is decided by
      their role, which is cumulative: `viewer`, then `runner`, then
      `maintainer`, then `admin`.

security:
  - session: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /auth/providers:
    get:
      tags: [auth]
      summary: List the identity providers one can sign in with
      description: Only the providers the API has credentials for are listed.
      operationId: listProviders
      security: []
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"

  /auth/{provider}/login:
    get:
      tags: [auth]
      summary: Start a sign-in
      description: |
        Meant for a browser navigation, not for `fetch`. Sets a short-lived
        `ballast_oauth` cookie holding the state and PKCE verifier, then
        redirects to the provider's authorization page.
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: next
          in: query
          required: false
          description: |
            Path on the front end to return to once signed in. Anything that is
            not a plain path (a scheme, a host, a leading `//`, a backslash) is
            replaced by `/`.
          schema:
            type: string
            example: /runs/5439bf02-f910-479f-8bb1-dc72ff319d53
      responses:
        "302":
          description: Redirect to the provider, with the state and an S256 PKCE challenge.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: "`ballast_oauth`: Path=/auth/, Max-Age=600, HttpOnly, Secure, SameSite=Lax."
              schema: { type: string }
        "404":
          description: No such provider, or it is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/{provider}/callback:
    get:
      tags: [auth]
      summary: Finish a sign-in
      description: |
        Where the provider sends the browser back. Must be registered as the
        OAuth application's callback URL.

        The state must match the one in the `ballast_oauth` cookie, which is
        cleared whatever happens. On the first sign-in an organization is
        created, with a first project the user administers.

        Every outcome is a redirect to the front end: to `next` on success, to
        `/login?error=<code>` otherwise. The codes are `invalid_request` (no
        matching sign-in was started in this browser), `denied` (refused at
        the provider) and `signin_failed`.
      operationId: callback
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: Set by the provider when the user refused.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the front end.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              description: |
                On success, `ballast_session`: Path=/, HttpOnly, Secure,
                SameSite=Lax, Max-Age set to the session lifetime. In every
                case, `ballast_oauth` expired.
              schema: { type: string }

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Expires the session cookie. A POST, so that a link on another site cannot sign anyone out.
      operationId: logout
      security: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: "`ballast_session` expired."
              schema: { type: string }

  /me:
    get:
      tags: [me]
      summary: Who is signed in
      description: |
        The signed-in user and the organization the session acts for. It is what
        the application shell shows: the user's name, and the organization in
        the organization selector.

        A session can outlive its user for the rest of its lifetime; if the user
        no longer exists, the answer is `401`, not `404`.
      operationId: getMe
      x-ballast-permission: none
      responses:
        "200":
          description: The signed-in user and their organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /runs:
    post:
      tags: [runs]
      summary: Queue a run
      description: |
        Runs a scenario against an environment of the same project. The load
        is the profile's template unless `params` is given, and either way it
        is clamped to the environment's `max_vus` and `max_duration_s` before
        it is stored. The run is executed later by the worker.

        Refused with `403` when the environment's ownership has not been
        verified, and when the environment declares an allowed window that the
        run does not fit inside — either because it is shut now, or because the
        run would still be generating load after it closes. The length compared
        is the clamped one. Both refusals are logged.
      operationId: enqueueRun
      x-ballast-permission: run_test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRunRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueRunResponse"
        "400":
          description: |
            The body is not valid JSON, an identifier is not a UUID, the
            profile is unknown or its parameters describe no runnable test, or
            the scenario and the environment belong to different projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The environment has not been verified, or its allowed window does not
            have room for this run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unverified:
                  value:
                    error: this environment has not been verified
                outsideWindow:
                  value:
                    error: "the environment accepts no load at this hour: it closes in 10m0s and the run would last 20m0s"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            This installation is not accepting new runs: somebody has thrown
            the platform's switch, and nothing about the request was even read.
            Runs already under way are unaffected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                suspended:
                  value:
                    error: Ballast is not accepting new runs

  /runs/stop-all:
    post:
      tags: [runs]
      summary: Emergency stop
      description: |
        Cancels every queued run of the organization and asks every running one
        to stop. The two are counted separately because they are not the same
        thing: a queued run is over when this returns, and a running one is
        ended by the worker executing it, once that worker has destroyed the
        container — a couple of seconds later.

        Reserved to somebody who administers **every** project of the
        organization. The check is made project by project, and anything less is
        refused with `403` rather than given a stop that silently leaves part of
        the load running; cancelling run by run stays open to them.
      operationId: stopAllRuns
      x-ballast-permission: cancel_run
      responses:
        "200":
          description: What was stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopAllResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller does not administer every project of the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /runs/{id}:
    get:
      tags: [runs]
      summary: Read a run and its results
      description: |
        Metrics and threshold verdicts are empty until the run has finished.
        Verdicts are k6's own; Ballast never recomputes them.
      operationId: getRun
      x-ballast-permission: view_project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [runs]
      summary: Cancel a run
      description: |
        Stops a run that is queued or being executed.

        The two answers differ because the facts do. A queued run is cancelled
        by the time this returns — nothing had started, and it held no target —
        and the response is `200`. A run being executed has only been *asked* to
        stop: its generator is still loading the target for a second or two, so
        the response is `202`, and the run reaches `cancelled` when the worker
        executing it has destroyed the container and freed the target. A client
        watching for that reads `cancel_requested_at` on the run, which is set
        as soon as the request is recorded.

        A run that has already finished answers `409`: nothing about the request
        is wrong, there is simply nothing left to stop.
      operationId: cancelRun
      x-ballast-permission: cancel_run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The run was queued and is now cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunResponse"
              example:
                id: 8f14e45f-ceea-467a-9e2a-3f1f0f5b1f11
                status: cancelled
                outcome: cancelled
        "202":
          description: |
            The run is being executed and has been asked to stop. It is ended by
            the worker executing it, within a few seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunResponse"
              example:
                id: 8f14e45f-ceea-467a-9e2a-3f1f0f5b1f11
                status: running
                outcome: cancellation_requested
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run has already finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                finished:
                  value:
                    error: this run has already finished
        "500":
          $ref: "#/components/responses/InternalError"

  /runs/{id}/logs:
    get:
      tags: [runs]
      summary: Follow a run's output
      description: |
        The lines a run's generator wrote, as Server-Sent Events
        (`text/event-stream`). Opened while the run is under way, the stream
        sends everything written so far and then keeps sending as the run
        writes; opened after it finished, it sends the whole output and ends.

        Three kinds of event:

        - `line` — one line of output. Its `id` is the line's sequence number,
          and the data is a `LogLine`.
        - `end` — the run is over; the data is a `RunEnded` saying how. A client
          that receives it should not reconnect.
        - `error` — the stream stopped for a reason that arrived after the
          response had begun, so it could not be a status code.

        A comment line (`: keep-alive`) is sent every fifteen seconds down an
        idle stream, so that whatever sits in between does not decide the
        connection is dead.

        **Resuming.** Every `line` event carries its sequence number as the
        event id, so a browser reconnecting sends `Last-Event-ID` and receives
        what follows — no line twice and none skipped. A client that sends no
        such header is given the run from its first line.

        Nothing a run's own credentials consist of reaches these lines: the
        values of the environment's secrets, and any `Authorization`, `Cookie`
        or `Set-Cookie` header a script printed, are replaced with `[redacted]`
        before a line is ever stored.
      operationId: followRunLogs
      x-ballast-permission: view_project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          required: false
          description: |
            The sequence number of the last line the client already holds. Sent
            by a browser's EventSource on its own when it reconnects. An absent
            or unreadable value means the run is sent from its first line.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 0
                event: line
                data: {"seq":0,"stream":"stdout","message":"  ✓ status is 200","at":"2026-10-12T09:00:00Z"}

                : keep-alive

                event: end
                data: {"status":"passed"}
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects:
    get:
      tags: [projects]
      summary: List the caller's projects
      description: |
        The projects the caller is a member of, and no others. This is not a
        permission check: a project they do not belong to is simply not theirs,
        and does not appear.
      operationId: listProjects
      x-ballast-permission: none
      responses:
        "200":
          description: The projects, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [projects]
      summary: Create a project
      description: |
        The caller becomes the new project's `admin`.

        Requires `admin` in at least one project of the organization. There is
        no organization-wide role: every permission in Ballast is held within a
        project, so the nearest rule that stays scoped is that the caller
        already administers something here.
      operationId: createProject
      x-ballast-permission: manage_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The body is not valid JSON, or the name or slug is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another project already uses that slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: Read a project
      operationId: getProject
      x-ballast-permission: view_project
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [projects]
      summary: Rename a project
      description: |
        Only the display name moves. The slug does not: it appears in URLs and
        in object storage keys, where changing it would orphan what is already
        filed under it.

        Requires `admin`.
      operationId: updateProject
      x-ballast-permission: manage_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The renamed project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: The body is not valid JSON, the id is not a UUID, or the name is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Delete a project
      description: |
        Refused with `409` while the project holds any run. Its rows cascade, so
        deleting it would take the whole run history with it, and that is not
        recoverable.

        Requires `admin`.
      operationId: deleteProject
      x-ballast-permission: manage_project
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The project still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: this project still holds runs; deleting it would take their history with it
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: What the caller holds in a project
      description: |
        The caller's role in the project and the permissions they actually
        hold, by name, read from the database at the moment of asking. A mask
        stored on the membership replaces the role's; `custom` says when it does.

        This is what a client hides buttons by. It decides nothing: every
        request is still authorized on its own.

        It requires no permission, since it only describes the caller to
        themselves. A caller who is not a member is told the project is not
        found.
      operationId: getProjectPermissions
      x-ballast-permission: none
      responses:
        "200":
          description: The caller's access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/audit:
    get:
      tags: [projects]
      summary: Read a project's journal
      description: |
        Who did what, to which target, with what result, and when — newest
        first. Refusals as much as successes: an attempt to send load at a
        target nobody verified is exactly what this records, and nothing else
        records it, because nothing else happened.

        What it holds: runs queued and runs refused, cancellations, emergency
        stops, targets proved and approved, roles granted and revoked.

        Entries with no `project_id` belong to the organization rather than to
        any project — an emergency stop is one — and appear in every project's
        journal: an action on the organization concerns each of its projects.
        Entries with no `actor_id` were caused by Ballast itself, with nobody
        behind them: a worker refusing at the last moment a run that was
        accepted hours earlier.

        Reserved to an administrator of the project. The journal is the record
        people are held to, and reading it is a different thing from taking
        part in the project.

        Nothing here ever carries a secret, a token, a verification challenge
        or a header: `details` holds a small set of keys chosen per action.
      operationId: readProjectAudit
      x-ballast-permission: manage_project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: |
            How many entries to return, newest first. Defaults to 100 and is
            capped at 500: a journal only grows, so no reading is the whole of
            it.
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          description: The project id is not a UUID, or limit is not a positive whole number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: The caller is not an administrator of this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [projects]
      summary: List a project's members
      operationId: listMembers
      x-ballast-permission: view_project
      responses:
        "200":
          description: The members, by email address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - name: userId
        in: path
        required: true
        description: A user of the caller's organization.
        schema: { type: string, format: uuid }

    put:
      tags: [projects]
      summary: Grant or change a role
      description: |
        Adds the user to the project, or changes the role they already hold.

        Refused with `409` when it would leave the project with no
        administrator, including when the caller is demoting themselves: a
        project nobody can administer cannot be repaired through this API.

        Requires `admin`.
      operationId: setMemberRole
      x-ballast-permission: manage_members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleRequest"
      responses:
        "204":
          description: The role is set.
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the role is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The project would be left with no administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [projects]
      summary: Remove a member
      description: |
        Refused with `409` when it would leave the project with no
        administrator.

        Requires `admin`.
      operationId: removeMember
      x-ballast-permission: manage_members
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: This user is not a member of this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The project would be left with no administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [scenarios]
      summary: List a project's scenarios
      description: Without their scripts. Read one to get its script.
      operationId: listScenarios
      x-ballast-permission: view_project
      responses:
        "200":
          description: The scenarios, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [scenarios]
      summary: Import a scenario
      description: |
        The script is inspected before it is stored, and refused with `422` when
        it exports its own `options`, addresses a host of its own, or never reads
        `__ENV.BASE_URL`. The response then lists what was wrong.

        A script whose requests carry no `name` tag is accepted and comes back
        with a warning: without them every endpoint is measured as one, and a
        threshold cannot single one out.
      operationId: createScenario
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScenarioRequest"
      responses:
        "201":
          description: Created, as version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The body is not valid JSON, or the name or the load is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another scenario of this project already uses that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ScriptRefused"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: Read a scenario
      description: |
        With its current script, and the warnings inspecting it raises. Those are
        worth reading before launching a run.
      operationId: getScenario
      x-ballast-permission: view_project
      responses:
        "200":
          description: The scenario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [scenarios]
      summary: Change a scenario
      description: |
        Anything left out stays as it is.

        Changing the script writes a **new version** and overwrites nothing. Runs
        already recorded keep pointing at the version they executed, and that
        version can still be read back.

        Renaming writes no version: a name is not something a run executed.
      operationId: updateScenario
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: The scenario, at its new version if the script changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the name or load is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ScriptRefused"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [scenarios]
      summary: Delete a scenario
      description: |
        Refused with `409` while the scenario holds any run: its rows cascade, so
        deleting it would take their history with it.
      operationId: deleteScenario
      x-ballast-permission: manage_scenarios
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The scenario still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: List a scenario's versions
      description: |
        Newest first. This is how the script a past run executed is read back: a
        run carries `scenario_version`, and nothing ever overwrites one.
      operationId: listScenarioVersions
      x-ballast-permission: view_project
      responses:
        "200":
          description: Every version ever written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioVersionListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/thresholds:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: List a scenario's thresholds
      operationId: listThresholds
      x-ballast-permission: view_project
      responses:
        "200":
          description: The rules this scenario imposes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [scenarios]
      summary: Impose a threshold
      description: |
        The metric accepts k6's tagged syntax, so a rule can single out one
        endpoint: `http_req_duration{name:POST /login}`.

        What the expression means is k6's to judge. Ballast reads the verdict of
        each threshold from the run's summary and never recomputes it.
      operationId: createThreshold
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThresholdRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdRule"
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the rule is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This scenario already imposes that rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/thresholds/{thresholdId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"
      - name: thresholdId
        in: path
        required: true
        schema: { type: string, format: uuid }

    delete:
      tags: [scenarios]
      summary: Drop a threshold
      description: |
        Runs already recorded keep their verdicts: those were frozen onto the run
        when it finished, and nothing here touches them.
      operationId: deleteThreshold
      x-ballast-permission: manage_scenarios
      responses:
        "204":
          description: Dropped.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [runs]
      summary: List a project's runs
      description: |
        Newest first, a page at a time. Each run says what was executed,
        against which environment, and how it ended; its metrics and threshold
        verdicts are read one run at a time, from `GET /runs/{id}`.

        A response with `next` has a following page: pass `next` back as
        `before`. `limit=1` is how a caller reads a project's last run.
      operationId: listProjectRuns
      x-ballast-permission: view_project
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            How many runs to return. Absent means 20; anything above 100 is
            read as 100. Zero, a negative number or a non-number is refused.
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: before
          in: query
          required: false
          description: |
            The `next` of the previous page. Opaque: only a value this API
            handed out is accepted.
          schema:
            type: string
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        "400":
          description: |
            The project id is not a UUID, the limit is not a positive whole
            number, or `before` is not a cursor this API handed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [environments]
      summary: List a project's target environments
      operationId: listEnvironments
      x-ballast-permission: view_project
      responses:
        "200":
          description: The environments, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [environments]
      summary: Declare a target environment
      description: |
        The environment is created `pending`, whatever the request says, and no run
        may be sent to it until its ownership has been proved and an `admin` has
        approved it.

        `max_vus` and `max_duration_s` are the ceilings every run here is clamped
        to before it is written, so a profile asking for more is lowered rather
        than refused.
      operationId: createEnvironment
      x-ballast-permission: manage_environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Declared, pending verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          description: |
            The body is not valid JSON, or the name, the base URL, the ceilings or
            the window are refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another environment of this project already uses that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    get:
      tags: [environments]
      summary: Read one environment
      operationId: getEnvironment
      x-ballast-permission: view_project
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [environments]
      summary: Change an environment
      description: |
        Anything left out stays as it is. `allowed_window` sent as `null` removes
        the window, which is how a target goes back to taking load at any hour.

        **Pointing the environment at another origin resets its verification to
        `pending`.** The proof was served by the old scheme, host and port and says
        nothing about the next, so the target has to be proved and approved again
        before any run may be sent there. Editing the path below the host leaves
        the verification standing.
      operationId: updateEnvironment
      x-ballast-permission: manage_environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnvironmentRequest"
      responses:
        "200":
          description: The environment as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          description: The body is not valid JSON, or one of the values is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another environment of this project already uses that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [environments]
      summary: Remove an environment
      description: |
        Refused with `409` while any run exists against this target: the rows
        cascade, so deleting it would take the history of everything ever measured
        there with it.
      operationId: deleteEnvironment
      x-ballast-permission: manage_environments
      responses:
        "204":
          description: Removed, with its secrets.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The environment still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/secrets:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    get:
      tags: [environments]
      summary: List the keys set on an environment
      description: |
        The keys and when they were set. **No endpoint returns the value of a
        secret**: it is encrypted on its way in and decrypted only into the
        generator's own environment.

        This takes `manage_environments` rather than `view_project`, because the
        name of a key says how the target expects to be authenticated.
      operationId: listSecrets
      x-ballast-permission: manage_environments
      responses:
        "200":
          description: The keys, in alphabetical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/secrets/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/SecretKey"

    put:
      tags: [environments]
      summary: Set a secret
      description: |
        Stores the value under `key`, replacing whatever was there. It is
        encrypted with AES-256-GCM before it reaches a disk, and the response
        carries the key and its dates — never the value.

        The key becomes an environment variable of the generator's container, so
        it must read as one: upper case letters, digits and underscores, starting
        with a letter. Two families of name are refused with `400`:

        - anything starting with `K6_`, because those configure k6 itself and take
          precedence over the options Ballast generates — `K6_VUS` would walk past
          the environment's own ceilings, `K6_OUT` would stream the metrics
          somewhere of the caller's choosing;
        - `BASE_URL`, which Ballast injects from the verified target.
      operationId: setSecret
      x-ballast-permission: manage_environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSecretRequest"
      responses:
        "200":
          description: Stored. The value is not echoed back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          description: |
            The body is not valid JSON, or the key or the value is refused. The
            message names the key and never the value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [environments]
      summary: Drop a secret
      operationId: deleteSecret
      x-ballast-permission: manage_environments
      responses:
        "204":
          description: Dropped.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/verification:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    get:
      tags: [environments]
      summary: Read the challenge a target has to serve
      description: |
        Create a file at `url`, holding `token` and nothing else, then call
        `verify`. `/.well-known` sits at the root of the origin, so a base URL
        with a path does not change where Ballast looks.

        The token is not a credential — it is meant to be published, on the
        target's own web server — but it is unguessable, so that nobody can serve
        a file in advance for an environment they do not own. It is returned here
        and nowhere else: the environment's own response does not carry it.
      operationId: getVerificationChallenge
      x-ballast-permission: manage_environments
      responses:
        "200":
          description: The challenge, and where the target stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallenge"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/verify:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    post:
      tags: [environments]
      summary: Fetch the challenge from the target
      description: |
        Ballast reads `/.well-known/ballast-<token>` on the target and checks that
        it holds the token. The contents decide, not the status code: a great many
        servers answer `200` to every path.

        A target that served it moves to `proof_ok`, and **that is still not a
        target load may be sent to**. An administrator has to approve it, which is
        a separate call under a separate permission.

        The fetch is bounded on purpose, since the address was chosen by whoever
        declared the environment. Refused with `422` when the target does not
        resolve to a publicly routable address — its own network, a private
        range, or the cloud metadata service — when it redirects to another host,
        when it does not answer within a few seconds, or when the file is not
        there or does not hold the token. The reason comes back in the body.

        Refused with `409` on a target that is already verified: recording a proof
        would move it back to `proof_ok` and take its approval away. Edit its base
        URL instead, which resets the verification by itself.
      operationId: verifyEnvironment
      x-ballast-permission: manage_environments
      responses:
        "200":
          description: The target served its challenge. It is now `proof_ok`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is already verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The attempt was made and proved nothing. The environment is now
            `verification_failed`, and the message says what to fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error: "the target's ownership could not be verified: the challenge file was not served: the target answered 404"
                privateAddress:
                  value:
                    error: "the target's ownership could not be verified: the target does not resolve to a publicly routable address: 10.0.0.1"
                redirected:
                  value:
                    error: "the target's ownership could not be verified: the target redirected the request elsewhere: staging.example.test sent it to 169.254.169.254"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    post:
      tags: [environments]
      summary: Approve a target for load
      description: |
        The decision that lets traffic leave Ballast's servers for this host, and
        the last gate in front of it.

        Reserved to `admin`, which is deliberate: a `maintainer` declares targets
        and runs their verification, and only an administrator says load may be
        sent at one. Were it the same right, whoever creates an environment would
        approve their own and the challenge would be decorative.

        Approving also adds the target's host to the project's allowlist, in the
        same transaction. Only a `proof_ok` target can be approved — `409`
        otherwise, including when it is already verified, since approving twice
        would rewrite who gave the approval and when.
      operationId: approveEnvironment
      x-ballast-permission: approve_target
      responses:
        "200":
          description: Approved. Runs may now be queued against this target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The target has not served its challenge yet, or was approved already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ballast_session
      description: |
        A JWT set by the sign-in flow. It names the user and the organization
        and carries no permission.

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [github, google]

    ScenarioID:
      name: scenarioId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProjectID:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }

    EnvironmentID:
      name: environmentId
      in: path
      required: true
      schema: { type: string, format: uuid }

    SecretKey:
      name: key
      in: path
      required: true
      description: |
        The environment variable the generator will read it as. Upper case
        letters, digits and underscores, starting with a letter; `K6_*` and
        `BASE_URL` are refused.
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        maxLength: 128
      example: API_TOKEN

  responses:
    ScriptRefused:
      description: |
        The script was refused, with what was wrong with it. Every fault is
        listed, so it can be fixed in one pass.
      content:
        application/json:
          schema:
            type: object
            required: [error, findings]
            properties:
              error: { type: string }
              findings:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptFinding"

    Forbidden:
      description: |
        The caller's role does not allow this. A project they are not a member
        of answers the same way as one that does not exist: telling the two
        apart would reveal that it exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: you do not have permission to do that here

    MalformedID:
      description: An identifier in the path is not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: sign in to continue
    NotFound:
      description: |
        Nothing with this identifier exists in the caller's organization —
        whether it does not exist at all or belongs to another organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Something failed. The details are in the server's logs, never in the response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: something went wrong

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Role:
      type: string
      description: |
        Cumulative: each role grants everything the one before it does.

        - `viewer` reads the project and what its runs measured
        - `runner` also queues and stops runs
        - `maintainer` also edits scenarios, thresholds and environments
        - `admin` also approves targets, manages members, renames and deletes
      enum: [viewer, runner, maintainer, admin]

    Project:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: |
            Appears in URLs and in object storage keys, and never changes after
            creation.
        created_at: { type: string, format: date-time }

    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      example:
        name: Checkout service
        slug: checkout

    UpdateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }

    Member:
      type: object
      required: [user_id, email, role, has_custom_permissions, created_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        has_custom_permissions:
          type: boolean
          description: |
            A set of permissions stored against this membership, which replaces
            the role's rather than adding to it. Nothing in Ballast writes one;
            it is reported so that the role shown here is never mistaken for the
            whole story.
        created_at: { type: string, format: date-time }

    AccessResponse:
      type: object
      required: [role, permissions, custom]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          description: The permissions the caller holds, in a fixed order.
          items:
            type: string
            enum:
              - view_project
              - run_test
              - cancel_run
              - manage_scenarios
              - manage_environments
              - approve_target
              - manage_members
              - manage_project
        custom:
          type: boolean
          description: True when a mask stored on the membership replaces the role's.

    MemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    SetMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    ScriptFindingCode:
      type: string
      description: |
        - `unparsable` — k6 would not load it either
        - `declares_options` — the script exports its own options, which Ballast
          never consults: the load comes from the profile, which is what makes
          the environment's ceilings binding
        - `no_base_url` — the script never reads `__ENV.BASE_URL`
        - `hardcoded_url` — an absolute URL written into the script, which would
          reach a host no environment vouched for
        - `no_request_name_tags` — a warning: several requests, none tagged
      enum:
        - unparsable
        - declares_options
        - no_base_url
        - hardcoded_url
        - no_request_name_tags

    ScriptFinding:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ScriptFindingCode"
        message:
          type: string
          description: Wording may change; key on the code.
        detail: { type: string }
        line:
          type: integer
          description: Counting from one. Absent when the finding is about the whole script.

    ScenarioSummary:
      type: object
      required: [id, name, version, default_profile, default_params, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        version:
          type: integer
          minimum: 1
          description: The current version. Every earlier one is still readable.
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScenarioListResponse:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioSummary"

    Scenario:
      allOf:
        - $ref: "#/components/schemas/ScenarioSummary"
        - type: object
          required: [script, warnings]
          properties:
            script: { type: string }
            warnings:
              type: array
              description: Worth reading before launching a run. Never a reason the request failed.
              items:
                $ref: "#/components/schemas/ScriptFinding"

    CreateScenarioRequest:
      type: object
      required: [name, script]
      properties:
        name: { type: string, maxLength: 120 }
        script:
          type: string
          description: A k6 script reading `__ENV.BASE_URL`, exporting no options of its own.
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"

    UpdateScenarioRequest:
      type: object
      description: Anything left out stays as it is.
      properties:
        name: { type: string, maxLength: 120 }
        script: { type: string }
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"

    ScenarioVersion:
      type: object
      required: [version, script, default_profile, default_params, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        script: { type: string }
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"
        created_by:
          type: string
          format: uuid
          description: Absent once the person who wrote it has been removed.
        created_at: { type: string, format: date-time }

    ScenarioVersionListResponse:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioVersion"

    # The rule a scenario imposes, as distinct from Threshold below, which is
    # k6's verdict on it for one run.
    ThresholdRule:
      type: object
      required: [id, metric, expression]
      properties:
        id: { type: string, format: uuid }
        metric:
          type: string
          maxLength: 200
          description: k6's tagged syntax is accepted, e.g. `http_req_duration{name:POST /login}`.
        expression: { type: string, maxLength: 120 }
      example:
        id: 7a1f1e6e-0000-4000-8000-000000000001
        metric: http_req_duration{name:POST /login}
        expression: p(95)<300

    ThresholdListResponse:
      type: object
      required: [thresholds]
      properties:
        thresholds:
          type: array
          items:
            $ref: "#/components/schemas/ThresholdRule"

    CreateThresholdRequest:
      type: object
      required: [metric, expression]
      properties:
        metric: { type: string, maxLength: 200 }
        expression: { type: string, maxLength: 120 }

    MeResponse:
      type: object
      required: [user, organization]
      properties:
        user:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid }
            name:
              type: string
              description: As the identity provider gave it. May be empty.
            email: { type: string, format: email }
        organization:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: string
            enum: [github, google]

    ProfileKind:
      type: string
      enum: [smoke, load, stress, spike, soak]

    ProfileParams:
      type: object
      description: The shape of the load, in whole seconds. The total duration must be at least one second.
      required: [target_vus, ramp_up_s, plateau_s, ramp_down_s]
      properties:
        target_vus: { type: integer, minimum: 1 }
        ramp_up_s: { type: integer, minimum: 0 }
        plateau_s: { type: integer, minimum: 0 }
        ramp_down_s: { type: integer, minimum: 0 }

    EnqueueRunRequest:
      type: object
      required: [scenario_id, environment_id, profile]
      properties:
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
      example:
        scenario_id: 00000000-0000-4000-8000-000000000003
        environment_id: 00000000-0000-4000-8000-000000000004
        profile: smoke

    EnqueueRunResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/RunStatus"

    CancelRunResponse:
      type: object
      required: [id, status, outcome]
      properties:
        id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/RunStatus"
        outcome:
          type: string
          description: |
            `cancelled` when the run had not started and is now over.
            `cancellation_requested` when a generator is running and has been
            asked to stop: the worker executing it writes the ending.
          enum: [cancelled, cancellation_requested]

    StopAllResponse:
      type: object
      required: [cancelled, asked_to_stop]
      properties:
        cancelled:
          type: integer
          description: How many queued runs were cancelled outright.
        asked_to_stop:
          type: integer
          description: |
            How many running runs were asked to stop. Each is ended by the
            worker executing it, once it has destroyed the container.

    AuditEntry:
      type: object
      description: One line of a project's journal.
      required: [action, outcome, target_type, details, at]
      properties:
        action:
          type: string
          description: |
            What was attempted. The values are stored, so they do not change.
          enum:
            - run.queued
            - run.refused
            - run.cancelled
            - runs.stopped
            - target.verified
            - target.approved
            - member.role_changed
            - member.removed
        outcome:
          type: string
          description: Whether it was allowed.
          enum: [allowed, refused]
        actor_id:
          type: string
          format: uuid
          description: |
            Who did it. Absent when Ballast itself acted with nobody behind it.
        project_id:
          type: string
          format: uuid
          description: |
            The project concerned. Absent for an action on the organization.
        target_type:
          type: string
          enum: [run, environment, membership, organization]
        target_id:
          type: string
          format: uuid
          description: Absent when the action has no single target.
        details:
          type: object
          additionalProperties: { type: string }
          description: |
            A small set of keys chosen per action — a refusal's `reason`, an
            approval's `host`, a run's `profile`. Never a secret, a token or a
            header.
          example:
            reason: the target environment has not been verified
            environment_id: 2c6f0f0e-2b64-4e3f-9b1a-9a9d2f8a1e55
        at: { type: string, format: date-time }

    AuditListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"

    LogLine:
      type: object
      description: One line a run's generator wrote.
      required: [seq, stream, message, at]
      properties:
        seq:
          type: integer
          format: int64
          description: |
            Where the line falls in the run's output. One counter is shared
            between the two streams, so the order is the order the generator
            produced them. It is also the event's id, which is what a
            reconnection resumes from.
        stream:
          type: string
          enum: [stdout, stderr]
        message:
          type: string
          description: The line, with credentials replaced by `[redacted]`.
          example: "  ✓ status is 200"
        at: { type: string, format: date-time }

    RunEnded:
      type: object
      description: The last event of a log stream.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/RunStatus"

    RunStatus:
      type: string
      description: "`orphaned` is not terminal: the worker died mid-run and the run still has to be cleaned up."
      enum: [queued, running, passed, failed, errored, timeout, cancelled, rejected, skipped, orphaned]

    RunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next:
          type: string
          description: Present when another page follows. Pass it back as `before`.

    RunSummary:
      type: object
      description: A run as a list shows it. No metrics and no verdicts; see `GET /runs/{id}`.
      required:
        - id
        - project_id
        - scenario_id
        - environment_id
        - scenario_version
        - profile
        - params
        - status
        - created_at
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        scenario_version: { type: integer }
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
        status:
          $ref: "#/components/schemas/RunStatus"
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }

    RunResponse:
      type: object
      required:
        - id
        - project_id
        - scenario_id
        - environment_id
        - scenario_version
        - profile
        - params
        - status
        - created_at
        - metrics
        - thresholds
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        scenario_version:
          type: integer
          description: The version of the scenario that was run, frozen on the run.
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
        status:
          $ref: "#/components/schemas/RunStatus"
        error_message:
          type: string
          description: Why the run errored, when it did.
        cancel_requested_at:
          type: string
          format: date-time
          description: |
            When somebody asked this run to stop. Set as soon as the request is
            recorded, which is before the run has actually stopped: a client
            watching a cancellation of a running run waits for `status` to
            become `cancelled`.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        thresholds:
          type: array
          items:
            $ref: "#/components/schemas/Threshold"

    Metric:
      type: object
      description: One number k6 measured.
      required: [metric, stat, value]
      properties:
        metric:
          type: string
          example: http_req_duration
        tag:
          type: string
          description: The sub-metric's tag selector, absent for the metric itself.
          example: "expected_response:true"
        stat:
          type: string
          description: avg, min, med, max, p(90), p(95), p(99) for a trend; rate, count… otherwise.
          example: p(95)
        value:
          type: number
          description: Milliseconds for durations, a ratio between 0 and 1 for rates.

    Threshold:
      type: object
      description: k6's verdict on one rule of the scenario.
      required: [metric, expression, passed]
      properties:
        metric:
          type: string
          example: http_req_duration
        expression:
          type: string
          example: p(95)<2000
        passed:
          type: boolean

    AllowedWindow:
      type: object
      description: |
        The stretch of the day a target accepts load, read in its own timezone. A
        `start` after an `end` crosses midnight: `22:00` to `06:00` is the night.

        `start` is inclusive and `end` is not. A run must fit **entirely** inside
        the window: one asked for while it is shut is refused with `403`, and so
        is one that would still be generating load after it closes. The check is
        made again before the generator starts, because a run accepted inside the
        window can wait in the queue until there is no longer room for it.

        The hours are real hours, not clock minutes: on the night the clocks go
        forward, a window open until `04:00` holds one hour less than it reads.
      required: [start, end, timezone]
      properties:
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "22:00"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "06:00"
        timezone:
          type: string
          description: An IANA name. The window is wall-clock time there, daylight saving included.
          example: Europe/Paris

    Environment:
      type: object
      description: A target a project may be allowed to send load to.
      required:
        - id
        - name
        - base_url
        - verification_status
        - max_vus
        - max_duration_s
        - created_at
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 120
          example: staging
        base_url:
          type: string
          format: uri
          description: |
            What a scenario reads as `__ENV.BASE_URL`. `http` or `https`, a host,
            and no credentials, query string or fragment.
          example: https://staging.example.test
        verification_status:
          type: string
          enum: [pending, proof_ok, verified, verification_failed]
          description: |
            Only `verified` lets load through. `proof_ok` means the challenge was
            served and nobody has approved it yet, which is deliberately not
            enough.
        max_vus:
          type: integer
          minimum: 1
          maximum: 100000
        max_duration_s:
          type: integer
          minimum: 1
          maximum: 86400
        allowed_window:
          $ref: "#/components/schemas/AllowedWindow"
        created_at: { type: string, format: date-time }

    EnvironmentListResponse:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"

    CreateEnvironmentRequest:
      type: object
      required: [name, base_url, max_vus, max_duration_s]
      properties:
        name:
          type: string
          maxLength: 120
          example: staging
        base_url:
          type: string
          format: uri
          example: https://staging.example.test
        max_vus:
          type: integer
          minimum: 1
          maximum: 100000
          example: 50
        max_duration_s:
          type: integer
          minimum: 1
          maximum: 86400
          example: 600
        allowed_window:
          $ref: "#/components/schemas/AllowedWindow"

    UpdateEnvironmentRequest:
      type: object
      description: |
        Anything left out stays as it is. `allowed_window` sent as `null` removes
        the window; left out, it is untouched.
      properties:
        name: { type: string, maxLength: 120 }
        base_url: { type: string, format: uri }
        max_vus: { type: integer, minimum: 1, maximum: 100000 }
        max_duration_s: { type: integer, minimum: 1, maximum: 86400 }
        allowed_window:
          oneOf:
            - $ref: "#/components/schemas/AllowedWindow"
            - type: "null"

    Secret:
      type: object
      description: |
        A stored credential, as far as the API will ever describe one: its key and
        its dates. There is no field for the value, and no endpoint returns it.
      required: [id, key, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          example: API_TOKEN
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When the value was last replaced.

    SecretListResponse:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/Secret"

    SetSecretRequest:
      type: object
      description: The one value that travels into Ballast and never back out.
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Encrypted at rest with AES-256-GCM. No control characters: it becomes
            one entry of the generator's environment.
          example: a-token-for-the-test-account

    VerificationChallenge:
      type: object
      description: |
        What a target has to serve for Ballast to believe somebody owns it, and
        where that stands.
      required: [verification_status, token, url]
      properties:
        verification_status:
          type: string
          enum: [pending, proof_ok, verified, verification_failed]
        token:
          type: string
          description: |
            43 characters of base64url. The file must hold this and nothing else;
            a trailing newline is tolerated.
          example: 7sJ2kQ9vXr4mN1pZ8tLbYw3hG6fD0aEcUiOqRsTuVwY
        url:
          type: string
          format: uri
          description: Exactly where Ballast will look, at the root of the origin.
          example: https://staging.example.test/.well-known/ballast-7sJ2kQ9vXr4mN1pZ8tLbYw3hG6fD0aEcUiOqRsTuVwY
        verified_at:
          type: string
          format: date-time
          description: Absent until an administrator approves the target.
        verified_by:
          type: string
          format: uuid
          description: Who approved it. Absent until then.
