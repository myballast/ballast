          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [scenarios]
      summary: Change a scenario
      description: |
        Anything left out stays as it is.

        Changing the script writes a **new version** and overwrites nothing. Runs
        already recorded keep pointing at the version they executed, and that
        version can still be read back.

        Renaming writes no version: a name is not something a run executed.

        Sending a `graph` writes a new version holding the graph and the script
        generated from it, or none when the graph is the one already stored. A
        graph the generator could not write is refused with `422` and nothing is
        stored.
      operationId: updateScenario
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: The scenario, at its new version if the script changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the name or load is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A `script` was sent for a scenario whose `mode` is `graph` (that
            script is generated from the graph, so an edit would be kept only
            until the next save), or a `graph` was sent for a scenario written
            as code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The script was refused with its findings, or the graph is one no
            script can be written from (`error` says why). Among the reasons: a
            header that carries a credential (`Authorization`,
            `Proxy-Authorization`, `Cookie`, `Set-Cookie`) whose value reads no
            `{{variable}}`. A graph is stored in the clear, so a token cannot be
            typed into one; it is read from a secret of the environment at run time.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    required: [error, findings]
                    properties:
                      error: { type: string }
                      findings:
                        type: array
                        items:
                          $ref: "#/components/schemas/ScriptFinding"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [scenarios]
      summary: Delete a scenario
      description: |
        Refused with `409` while the scenario holds any run: its rows cascade, so
        deleting it would take their history with it.
      operationId: deleteScenario
      x-ballast-permission: manage_scenarios
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The scenario still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/graph/validate:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    post:
      tags: [scenarios]
      summary: Check a graph without saving it
      description: |
        Answers whether a save of this graph would be accepted, with the same
        checks and nothing written. It asks for the right to save, since it
        exists for the person about to save. Refused with `409` on a scenario
        written as code.
      operationId: validateScenarioGraph
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateGraphRequest"
      responses:
        "204":
          description: The graph would be accepted.
        "400":
          description: The body is not valid JSON or an id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The scenario is written as code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The graph is refused; `error` says why, including a credential header
            that is typed in rather than read from a variable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: List a scenario's versions
      description: |
        Newest first. This is how the script a past run executed is read back: a
        run carries `scenario_version`, and nothing ever overwrites one.
      operationId: listScenarioVersions
      x-ballast-permission: view_project
      responses:
        "200":
          description: Every version ever written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioVersionListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/thresholds:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"

    get:
      tags: [scenarios]
      summary: List a scenario's thresholds
      operationId: listThresholds
      x-ballast-permission: view_project
      responses:
        "200":
          description: The rules this scenario imposes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [scenarios]
      summary: Impose a threshold
      description: |
        The metric accepts k6's tagged syntax, so a rule can single out one
        endpoint: `http_req_duration{name:POST /login}`.

        What the expression means is k6's to judge. Ballast reads the verdict of
        each threshold from the run's summary and never recomputes it.
      operationId: createThreshold
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThresholdRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdRule"
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the rule is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This scenario already imposes that rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/scenarios/{scenarioId}/thresholds/{thresholdId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/ScenarioID"
      - name: thresholdId
        in: path
        required: true
        schema: { type: string, format: uuid }

    patch:
      tags: [scenarios]
      summary: Change a threshold
      description: |
        Changes the rule in place; anything left out stays as it is. The metric
        accepts k6's tagged syntax, as on creation.

        Runs already recorded keep their verdicts: those were frozen onto the run
        when it finished, and nothing here touches them.
      operationId: updateThreshold
      x-ballast-permission: manage_scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThresholdRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThresholdRule"
        "400":
          description: The body is not valid JSON, an id is not a UUID, or the rule is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This scenario already imposes the rule this one would become.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [scenarios]
      summary: Drop a threshold
      description: |
        Runs already recorded keep their verdicts: those were frozen onto the run
        when it finished, and nothing here touches them.
      operationId: deleteThreshold
      x-ballast-permission: manage_scenarios
      responses:
        "204":
          description: Dropped.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [runs]
      summary: List a project's runs
      description: |
        Newest first, a page at a time. Each run says what was executed,
        against which environment, who started it and how it ended, with the
        two headline numbers of a finished run (`p95_ms`, `error_rate`); its
        other metrics and its threshold verdicts are read one run at a time,
        from `GET /runs/{id}`.

        The list can be narrowed by `status`, `scenario_id` and
        `environment_id`, alone or together. A scenario or an environment of
        another project matches nothing: the list is always of this project.

        Both ways are paged by cursor, never by offset, so a page does not shift
        when runs arrive: a response with `next` has an older page, pass `next`
        back as `before`; a response with `prev` has a newer one, pass `prev`
        back as `after`. `limit=1` is how a caller reads a project's last run.
      operationId: listProjectRuns
      x-ballast-permission: view_project
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            How many runs to return. Absent means 20; anything above 100 is
            read as 100. Zero, a negative number or a non-number is refused.
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: status
          in: query
          required: false
          description: Only the runs in this status.
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: scenario_id
          in: query
          required: false
          description: Only the runs of this scenario.
          schema: { type: string, format: uuid }
        - name: environment_id
          in: query
          required: false
          description: Only the runs against this environment.
          schema: { type: string, format: uuid }
        - name: before
          in: query
          required: false
          description: |
            The `next` of a page: the runs strictly older than it. Opaque: only
            a value this API handed out is accepted. Not with `after`.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: |
            The `prev` of a page: the runs strictly newer than it, the page
            that comes before. Opaque, like `before`. Not with `before`.
          schema:
            type: string
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        "400":
          description: |
            The project id is not a UUID, the limit is not a positive whole
            number, `status` is not a status, `scenario_id` or `environment_id`
            is not a UUID, `before` or `after` is not a cursor this API handed
            out, or both of them are given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/stats:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [runs]
      summary: The figures of a project over its last days
      description: |
        The five figures of the project's page, added up in SQL over the last
        `days` days and set against the same number of days before. Days are whole
        UTC days, today included: the same project gives the same figures to
        whoever reads it, wherever they are.

        What each figure counts:

        - `total_runs`: every run created in the window, whatever became of it.
        - `failed_runs`: runs that failed, errored or timed out.
        - `pass_rate`: runs that passed, over runs that ended with a verdict
          (passed, failed, errored, timed out). A run that was cancelled,
          rejected or skipped, or is still queued or running, says nothing about
          the service under test and is in neither side.
        - `avg_duration_s`: how long a run with a verdict lasted, on average.
        - `p95_ms`: the mean of the runs' 95th percentile of the request
          duration. A percentile of a whole period cannot be rebuilt from the
          percentile of each run, so this is the mean of them, and not a
          percentile of every request.

        Each figure has `value`, `previous` (the same figure over the window
        before), `change` and `series` (a point per day of the current window,
        oldest first). A `null` is "nothing to say" and never zero: a window with
        no verdict has no pass rate, and a change against a window with no run is
        not a number. `change` is in the figure's own unit, except for the pass
        rate, in percentage points, and the number of runs, in percent.
      operationId: getProjectStats
      x-ballast-permission: view_project
      parameters:
        - name: days
          in: query
          required: false
          description: |
            How many days each window holds. Absent means 30; anything above 90
            is read as 90. Zero, a negative number or a non-number is refused.
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatsResponse"
        "400":
          description: The project id is not a UUID, or `days` is not a positive whole number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments:
    parameters:
      - $ref: "#/components/parameters/ProjectID"

    get:
      tags: [environments]
      summary: List a project's target environments
      operationId: listEnvironments
      x-ballast-permission: view_project
      responses:
        "200":
          description: The environments, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [environments]
      summary: Declare a target environment
      description: |
        The environment is created `pending`, whatever the request says, and no run
        may be sent to it until its ownership has been proved and an `admin` has
        approved it.

        `max_vus` and `max_duration_s` are the ceilings every run here is clamped
        to before it is written, so a profile asking for more is lowered rather
        than refused.
      operationId: createEnvironment
      x-ballast-permission: manage_environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Declared, pending verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          description: |
            The body is not valid JSON, or the name, the base URL, the ceilings or
            the window are refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another environment of this project already uses that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    get:
      tags: [environments]
      summary: Read one environment
      operationId: getEnvironment
      x-ballast-permission: view_project
      responses:
        "200":
          description: The environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [environments]
      summary: Change an environment
      description: |
        Anything left out stays as it is. `allowed_window` sent as `null` removes
        the window, which is how a target goes back to taking load at any hour.

        **Pointing the environment at another origin resets its verification to
        `pending`.** The proof was served by the old scheme, host and port and says
        nothing about the next, so the target has to be proved and approved again
        before any run may be sent there. Editing the path below the host leaves
        the verification standing.
      operationId: updateEnvironment
      x-ballast-permission: manage_environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnvironmentRequest"
      responses:
        "200":
          description: The environment as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          description: The body is not valid JSON, or one of the values is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another environment of this project already uses that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [environments]
      summary: Remove an environment
      description: |
        Refused with `409` while any run exists against this target: the rows
        cascade, so deleting it would take the history of everything ever measured
        there with it.
      operationId: deleteEnvironment
      x-ballast-permission: manage_environments
      responses:
        "204":
          description: Removed, with its secrets.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The environment still holds runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/secrets:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    get:
      tags: [environments]
      summary: List the keys set on an environment
      description: |
        The keys and when they were set. **No endpoint returns the value of a
        secret**: it is encrypted on its way in and decrypted only into the
        generator's own environment.

        This takes `manage_environments` rather than `view_project`, because the
        name of a key says how the target expects to be authenticated.
      operationId: listSecrets
      x-ballast-permission: manage_environments
      responses:
        "200":
          description: The keys, in alphabetical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretListResponse"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/secrets/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/SecretKey"

    put:
      tags: [environments]
      summary: Set a secret
      description: |
        Stores the value under `key`, replacing whatever was there. It is
        encrypted with AES-256-GCM before it reaches a disk, and the response
        carries the key and its dates — never the value.

        The key becomes an environment variable of the generator's container, so
        it must read as one: upper case letters, digits and underscores, starting
        with a letter. Two families of name are refused with `400`:

        - anything starting with `K6_`, because those configure k6 itself and take
          precedence over the options Ballast generates — `K6_VUS` would walk past
          the environment's own ceilings, `K6_OUT` would stream the metrics
          somewhere of the caller's choosing;
        - `BASE_URL`, which Ballast injects from the verified target.
      operationId: setSecret
      x-ballast-permission: manage_environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSecretRequest"
      responses:
        "200":
          description: Stored. The value is not echoed back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          description: |
            The body is not valid JSON, or the key or the value is refused. The
            message names the key and never the value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [environments]
      summary: Drop a secret
      operationId: deleteSecret
      x-ballast-permission: manage_environments
      responses:
        "204":
          description: Dropped.
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/verification:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    get:
      tags: [environments]
      summary: Read the challenge a target has to serve
      description: |
        Create a file at `url`, holding `token` and nothing else, then call
        `verify`. `/.well-known` sits at the root of the origin, so a base URL
        with a path does not change where Ballast looks.

        The token is not a credential — it is meant to be published, on the
        target's own web server — but it is unguessable, so that nobody can serve
        a file in advance for an environment they do not own. It is returned here
        and nowhere else: the environment's own response does not carry it.
      operationId: getVerificationChallenge
      x-ballast-permission: manage_environments
      responses:
        "200":
          description: The challenge, and where the target stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallenge"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/verify:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    post:
      tags: [environments]
      summary: Fetch the challenge from the target
      description: |
        Ballast reads `/.well-known/ballast-<token>` on the target and checks that
        it holds the token. The contents decide, not the status code: a great many
        servers answer `200` to every path.

        A target that served it moves to `proof_ok`, and **that is still not a
        target load may be sent to**. An administrator has to approve it, which is
        a separate call under a separate permission.

        The fetch is bounded on purpose, since the address was chosen by whoever
        declared the environment. Refused with `422` when the target does not
        resolve to a publicly routable address — its own network, a private
        range, or the cloud metadata service — when it redirects to another host,
        when it does not answer within a few seconds, or when the file is not
        there or does not hold the token. The reason comes back in the body.

        Refused with `409` on a target that is already verified: recording a proof
        would move it back to `proof_ok` and take its approval away. Edit its base
        URL instead, which resets the verification by itself.
      operationId: verifyEnvironment
      x-ballast-permission: manage_environments
      responses:
        "200":
          description: The target served its challenge. It is now `proof_ok`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is already verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The attempt was made and proved nothing. The environment is now
            `verification_failed`, and the body says what to fix: the sentence, and
            under `failure` where Ballast looked, what answered and how it differed.
            It never carries what the target's file said — only its status and its
            size — because the address was chosen by whoever declared the
            environment, and repeating a page back would make this a way to read
            pages through Ballast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationFailed"
              examples:
                missing:
                  value:
                    error: "the target's ownership could not be verified: the challenge file was not served: the target answered 404"
                    failure:
                      searched: https://staging.example.test/.well-known/ballast-<token>
                      status: 404
                      reason: "the challenge file was not served: the target answered 404"
                notTheToken:
                  value:
                    error: "the target's ownership could not be verified: the challenge file does not hold the expected token"
                    failure:
                      searched: https://staging.example.test/.well-known/ballast-<token>
                      status: 200
                      bytes: 5120
                      reason: the challenge file does not hold the expected token
                privateAddress:
                  value:
                    error: "the target's ownership could not be verified: the target does not resolve to a publicly routable address: 10.0.0.1"
                    failure:
                      searched: https://staging.example.test/.well-known/ballast-<token>
                      reason: "the target does not resolve to a publicly routable address: 10.0.0.1"
                redirected:
                  value:
                    error: "the target's ownership could not be verified: the target redirected the request elsewhere: staging.example.test sent it to 169.254.169.254"
                    failure:
                      searched: https://staging.example.test/.well-known/ballast-<token>
                      reason: "the target redirected the request elsewhere: staging.example.test sent it to 169.254.169.254"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{projectId}/environments/{environmentId}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/EnvironmentID"

    post:
      tags: [environments]
      summary: Approve a target for load
      description: |
        The decision that lets traffic leave Ballast's servers for this host, and
        the last gate in front of it.

        Reserved to `admin`, which is deliberate: a `maintainer` declares targets
        and runs their verification, and only an administrator says load may be
        sent at one. Were it the same right, whoever creates an environment would
        approve their own and the challenge would be decorative.

        Approving also adds the target's host to the project's allowlist, in the
        same transaction. Only a `proof_ok` target can be approved — `409`
        otherwise, including when it is already verified, since approving twice
        would rewrite who gave the approval and when.
      operationId: approveEnvironment
      x-ballast-permission: approve_target
      responses:
        "200":
          description: Approved. Runs may now be queued against this target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/MalformedID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The target has not served its challenge yet, or was approved already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ballast_session
      description: |
        A JWT set by the sign-in flow. It names the user and the organization
        and carries no permission.

  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      description: The secret in an invitation link.
      schema: { type: string }

    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [github, google]

    ScenarioID:
      name: scenarioId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProjectID:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }

    EnvironmentID:
      name: environmentId
      in: path
      required: true
      schema: { type: string, format: uuid }

    SecretKey:
      name: key
      in: path
      required: true
      description: |
        The environment variable the generator will read it as. Upper case
        letters, digits and underscores, starting with a letter; `K6_*` and
        `BASE_URL` are refused.
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        maxLength: 128
      example: API_TOKEN

  responses:
    ScriptRefused:
      description: |
        The script was refused, with what was wrong with it. Every fault is
        listed, so it can be fixed in one pass.
      content:
        application/json:
          schema:
            type: object
            required: [error, findings]
            properties:
              error: { type: string }
              findings:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptFinding"

    Forbidden:
      description: |
        The caller's role does not allow this. A project they are not a member
        of answers the same way as one that does not exist: telling the two
        apart would reveal that it exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: you do not have permission to do that here

    MalformedID:
      description: An identifier in the path is not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: sign in to continue
    NotFound:
      description: |
        Nothing with this identifier exists in the caller's organization —
        whether it does not exist at all or belongs to another organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Something failed. The details are in the server's logs, never in the response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: something went wrong

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Role:
      type: string
      description: |
        Cumulative: each role grants everything the one before it does.

        - `viewer` reads the project and what its runs measured
        - `runner` also queues and stops runs
        - `maintainer` also edits scenarios, thresholds and environments
        - `admin` also approves targets, manages members, renames and deletes
      enum: [viewer, runner, maintainer, admin]

    Project:
      type: object
      required: [id, name, slug, infra, region, owner, stack, favorite, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: |
            Appears in URLs and in object storage keys, and never changes after
            creation.
        infra:
          type: string
          maxLength: 40
          description: Where it runs, in a word or two — `k8s`, `railway`, `vm`. Empty when not said.
          example: k8s
        region:
          type: string
          maxLength: 40
          description: Empty when not said.
          example: eu-west-1
        owner:
          type: string
          maxLength: 80
          description: |
            A person or a team, as text. It is not a user and grants nothing.
            Empty when not said.
        stack:
          type: array
          maxItems: 12
          description: |
            Short labels for what the project is made of. Always an array, empty
            when none is said, never `null`.
          items:
            type: string
            maxLength: 16
            pattern: "^[a-z0-9][a-z0-9._+-]*$"
          example: [go, pg, k6]
        favorite:
          type: boolean
          description: |
            Whether the **caller** has starred it. Their own star: it is never
            another person's, in this response or any other.
        created_at: { type: string, format: date-time }

    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    CreateProjectRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 80 }
        slug:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        infra: { type: string, maxLength: 40 }
        region: { type: string, maxLength: 40 }
        owner: { type: string, maxLength: 80 }
        stack:
          type: array
          maxItems: 12
          description: |
            Stored in lower case, each label once, in the order given. A label is
            letters, digits and `. _ + -`, at most 16 characters.
          items: { type: string }
      example:
        name: Checkout service
        slug: checkout

    UpdateProjectRequest:
      type: object
      description: |
        Anything left out stays as it is. An empty string, or an empty `stack`,
        says it is not said any more. The slug cannot move.
      properties:
        name: { type: string, maxLength: 80 }
        infra: { type: string, maxLength: 40 }
        region: { type: string, maxLength: 40 }
        owner: { type: string, maxLength: 80 }
        stack:
          type: array
          maxItems: 12
          items: { type: string }

    Member:
      type: object
      required: [user_id, email, role, has_custom_permissions, created_at, last_activity]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        has_custom_permissions:
          type: boolean
          description: |
            A set of permissions stored against this membership, which replaces
            the role's rather than adding to it. Nothing in Ballast writes one;
            it is reported so that the role shown here is never mistaken for the
            whole story.
        created_at: { type: string, format: date-time }
        last_activity:
          type: [string, "null"]
          format: date-time
          description: |
            The newest entry of the project's journal this person wrote, and
            `null` when they have written none.

    AccessResponse:
      type: object
      required: [role, permissions, custom]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          description: The permissions the caller holds, in a fixed order.
          items:
            type: string
            enum:
              - view_project
              - run_test
              - cancel_run
              - manage_scenarios
              - manage_environments
              - approve_target
              - manage_members
              - manage_project
        custom:
          type: boolean
          description: True when a mask stored on the membership replaces the role's.

    MemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    SetMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    ScriptFindingCode:
      type: string
      description: |
        - `unparsable` — k6 would not load it either
        - `declares_options` — the script exports its own options, which Ballast
          never consults: the load comes from the profile, which is what makes
          the environment's ceilings binding
        - `no_base_url` — the script never reads `__ENV.BASE_URL`
        - `hardcoded_url` — an absolute URL written into the script, which would
          reach a host no environment vouched for
        - `no_request_name_tags` — a warning: several requests, none tagged
      enum:
        - unparsable
        - declares_options
        - no_base_url
        - hardcoded_url
        - no_request_name_tags

    ScriptFinding:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ScriptFindingCode"
        message:
          type: string
          description: Wording may change; key on the code.
        detail: { type: string }
        line:
          type: integer
          description: Counting from one. Absent when the finding is about the whole script.

    ScenarioSummary:
      type: object
      required: [id, name, version, default_profile, default_params, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        version:
          type: integer
          minimum: 1
          description: The current version. Every earlier one is still readable.
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScenarioListResponse:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioListItem"

    ScenarioListItem:
      description: A scenario as the list shows it, with how many thresholds it imposes.
      allOf:
        - $ref: "#/components/schemas/ScenarioSummary"
        - type: object
          required: [threshold_count]
          properties:
            threshold_count: { type: integer, minimum: 0 }

    Scenario:
      allOf:
        - $ref: "#/components/schemas/ScenarioSummary"
        - type: object
          required: [script, mode, warnings]
          properties:
            script: { type: string }
            mode:
              type: string
              enum: [code, graph]
              description: |
                How the scenario was written. `graph` means the script was
                generated from a graph and is read only: sending a `script`
                back is refused with `409`.
            graph:
              allOf:
                - $ref: "#/components/schemas/ScenarioGraph"
              description: |
                The graph of a scenario whose `mode` is `graph`, as the canvas
                edits it. Absent for a scenario written as code.
            warnings:
              type: array
              description: Worth reading before launching a run. Never a reason the request failed.
              items:
                $ref: "#/components/schemas/ScriptFinding"

    CreateScenarioRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        mode:
          type: string
          enum: [code, graph]
          default: code
          description: |
            How the scenario is written. `graph` starts from one request and the
            end it leads to, to be drawn on from there; its script is generated,
            so none may be sent. There is no conversion from code to a graph.
        script:
          type: string
          description: |
            A k6 script reading `__ENV.BASE_URL`, exporting no options of its own.
            Required when `mode` is `code`; refused with `400` when it is `graph`.
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"

    OpenAPIPreviewRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: The whole file as text, JSON or YAML. At most 5 MB.

    OpenAPIEndpoint:
      type: object
      required: [method, path, tag, summary, path_params, has_body, body_too_long]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
        path:
          type: string
          description: The template as the file wrote it, such as `/users/{id}`.
        tag:
          type: string
          description: The first tag of the operation, empty when it has none.
        summary:
          type: string
        path_params:
          type: array
          items: { type: string }
          description: The names between braces, as written.
        has_body:
          type: boolean
          description: The file gives this request a body, with or without an example.
        body_too_long:
          type: boolean
          description: An example exists but is too long to keep, so the body would be empty.

    OpenAPIAuthScheme:
      type: object
      required: [name, type, detail]
      description: |
        A way of authenticating that the file declares. It says what requests will
        need, and carries no value.
      properties:
        name: { type: string }
        type:
          type: string
          description: "`apiKey`, `http`, `oauth2`, `openIdConnect`, or `basic` for a Swagger 2.0 file."
        detail:
          type: string
          description: Where or how, such as `header X-API-Key` or `bearer`.

    OpenAPIPreviewResponse:
      type: object
      required: [title, base_path, endpoints, schemes, notes]
      properties:
        title: { type: string }
        base_path:
          type: string
          description: |
            The prefix the file says its API is served under, empty when it says
            none. The paths do not include it, so the environment's base URL
            should end with it.
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/OpenAPIEndpoint"
        schemes:
          type: array
          items:
            $ref: "#/components/schemas/OpenAPIAuthScheme"
        notes:
          type: array
          items: { type: string }
          description: Things worth knowing, such as operations that were left out.

    OpenAPIEndpointRef:
      type: object
      required: [method, path]
      properties:
        method: { type: string }
        path:
          type: string
          description: The template exactly as the preview returned it.

    ImportOpenAPIRequest:
      type: object
      required: [name, spec, endpoints]
      properties:
        name: { type: string, maxLength: 120 }
        spec:
          type: string
          description: The whole file again. Nothing is kept between the preview and the import.
        endpoints:
          type: array
          description: The ones to keep, in the order the requests should run. At most 199.
          items:
            $ref: "#/components/schemas/OpenAPIEndpointRef"

    ImportOpenAPIResponse:
      type: object
      required: [scenario, notes]
      properties:
        scenario:
          $ref: "#/components/schemas/Scenario"
        notes:
          type: array
          items: { type: string }
          description: What could not be carried over from the file, for the chosen endpoints.

    CatalogEndpoint:
      type: object
      required: [id, source, method, path, tag, summary, path_params, headers, content_type, body, body_too_long, created_at]
      properties:
        id: { type: string, format: uuid }
        source:
          type: string
          description: The file the endpoint was imported from.
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
        path:
          type: string
          description: The template as the file wrote it, such as `/users/{id}`.
        tag: { type: string }
        summary: { type: string }
        path_params:
          type: array
          items: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: The headers the file gave a value for. Never a credential.
        content_type: { type: string }
        body:
          type: string
          description: The example body, empty when the file gave none or it was too long to keep.
        body_too_long: { type: boolean }
        created_at: { type: string, format: date-time }

    CatalogListResponse:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEndpoint"

    CatalogImportRequest:
      type: object
      required: [source, spec, endpoints]
      properties:
        source:
          type: string
          maxLength: 120
          description: Names the file. Importing a source that exists replaces what it had.
        spec:
          type: string
          description: The whole file as text. Nothing is kept between the preview and the import.
        endpoints:
          type: array
          description: The ones to keep. At least one.
          items:
            $ref: "#/components/schemas/OpenAPIEndpointRef"

    CatalogImportResponse:
      type: object
      required: [count]
      properties:
        count: { type: integer, description: How many endpoints the source now has. }

    CatalogRemovedResponse:
      type: object
      required: [removed]
      properties:
        removed: { type: integer }

    CollectionPreviewRequest:
      type: object
      required: [collection]
      properties:
        collection:
          type: string
          description: The whole file as text, a Postman collection of format v2.0 or v2.1. At most 5 MB.
        environment:
          type: string
          description: An exported Postman environment. At most 5 MB. May be left out.

    CollectionRequest:
      type: object
      required: [position, folders, name, method, host, kind, path, has_body, left_out, findings]
      properties:
        position:
          type: integer
          description: How the request is named when chosen. Names repeat; positions do not.
        folders:
          type: array
          items: { type: string }
          description: The folders the request sits in, outermost first.
        name: { type: string }
        method: { type: string }
        host:
          type: string
          description: The host a HAR request was sent to. Empty for the other formats.
        kind:
          type: string
          enum: ["", api, document, script, style, image, font, media, other]
          description: |
            What a browser used a HAR request for — `api` is a XHR or fetch call. Empty
            for the other formats.
        path:
          type: string
          description: The template the request becomes, such as `/users/{id}`. Empty when it was left out.
        has_body: { type: boolean }
        left_out:
          type: boolean
          description: The request cannot become one of a scenario; its findings say why.
        findings:
          type: array
          items: { type: string }

    DetectedSecret:
      type: object
      required: [key, variable]
      description: |
        A secret the import found. It carries no value: the value stays in the file
        and is typed again where it belongs, on the environment.
      properties:
        key:
          type: string
          description: The environment key the scenario reads it from.
        variable:
          type: string
          description: The name it has in the scenario.

    ImportFinding:
      type: object
      required: [request, message]
      properties:
        request:
          type: string
          description: The name of the request, empty when the finding is about the collection.
        message: { type: string }

    CollectionPreviewResponse:
      type: object
      required: [name, requests, secrets, findings, variable_nodes]
      properties:
        name: { type: string }
        variable_nodes:
          type: integer
          description: |
            How many nodes the variables of the requests would take at the start of a
            scenario. A scenario holds at most 200 nodes, the end being one of them, so
            this much room is left less for requests.
        requests:
          type: array
          items:
            $ref: "#/components/schemas/CollectionRequest"
        secrets:
          type: array
          description: The keys to create if every request were imported.
          items:
            $ref: "#/components/schemas/DetectedSecret"
        findings:
          type: array
          description: What is about the collection as a whole. What is about one request is on the request.
          items:
            $ref: "#/components/schemas/ImportFinding"

    ImportCollectionRequest:
      type: object
      required: [name, collection, requests]
      properties:
        name: { type: string, maxLength: 120 }
        collection:
          type: string
          description: The whole file again. Nothing is kept between the preview and the import.
        environment:
          type: string
          description: The environment file again, if one was given.
        requests:
          type: array
          description: The positions to keep, in the order the requests should run. At least one.
          items: { type: integer }

    ImportCollectionResponse:
      type: object
      required: [scenario, secrets, findings]
      properties:
        scenario:
          $ref: "#/components/schemas/Scenario"
        secrets:
          type: array
          description: |
            The environment keys the scenario reads, to create with
            `PUT /projects/{projectId}/environments/{environmentId}/secrets/{key}`.
            Until they exist the scenario sends an empty value for each.
          items:
            $ref: "#/components/schemas/DetectedSecret"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ImportFinding"

    CatalogCollectionImportRequest:
      type: object
      required: [source, collection, requests]
      properties:
        source:
          type: string
          maxLength: 120
          description: Names the collection. Importing a source that exists replaces what it had.
        collection: { type: string }
        environment: { type: string }
        requests:
          type: array
          items: { type: integer }

    HARPreviewRequest:
      type: object
      required: [har]
      properties:
        har:
          type: string
          description: The whole file as text. At most 25 MB.

    ImportHARRequest:
      type: object
      required: [name, har, requests]
      properties:
        name: { type: string, maxLength: 120 }
        har:
          type: string
          description: The whole file again. Nothing is kept between the preview and the import.
        requests:
          type: array
          description: The positions to keep, in the order the requests should run. At least one.
          items: { type: integer }

    CatalogHARImportRequest:
      type: object
      required: [source, har, requests]
      properties:
        source:
          type: string
          maxLength: 120
          description: Names the file. Importing a source that exists replaces what it had.
        har: { type: string }
        requests:
          type: array
          items: { type: integer }

    CurlPreviewRequest:
      type: object
      required: [commands]
      properties:
        commands:
          type: string
          description: One or several curl commands as pasted. At most 256 KB and 200 commands.

    ImportCurlRequest:
      type: object
      required: [name, commands, requests]
      properties:
        name: { type: string, maxLength: 120 }
        commands:
          type: string
          description: The text again. Nothing is kept between the preview and the import.
        requests:
          type: array
          description: The positions to keep, in the order the requests should run. At least one.
          items: { type: integer }

    CatalogCurlImportRequest:
      type: object
      required: [source, commands, requests]
      properties:
        source:
          type: string
          maxLength: 120
          description: Names the commands. Importing a source that exists replaces what it had.
        commands: { type: string }
        requests:
          type: array
          items: { type: integer }

    CatalogCollectionImportResponse:
      type: object
      required: [count, findings]
      properties:
        count: { type: integer, description: How many endpoints the source now has. }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ImportFinding"

    GraphNode:
      type: object
      required: [id, kind]
      description: |
        One step of a graph scenario. One shape for every kind: the fields a kind
        does not use are left out, and the server says which ones a kind requires.
      properties:
        id: { type: string, maxLength: 64 }
        kind:
          type: string
          enum: [http_request, extract_variable, set_variable, condition, loop, think_time, assertion, end]
        method: { type: string }
        path: { type: string, description: "A template such as `/users/{id}`; it is also the request's name tag." }
        body: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        query:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: string }
        variable: { type: string }
        source:
          type: string
          enum: [body, header, status]
          description: |
            Where an `extract_variable` reads in the response. Left out it is the
            body, which is what a graph stored before there was a choice does.
            When the value is not there the generated script stops the iteration
            with a message naming the variable, rather than going on with an
            empty one.
        from:
          type: string
          description: |
            What an `extract_variable` reads from its `source`: a path in the JSON
            body (`data.token`, `items.0.id`; a leading `$.` is accepted), or the
            name of a header. Empty for `status`.
        value: { type: string }
        from_env: { type: string, description: "The key of a secret of the environment, read when the run starts." }
        expression: { type: string }
        iterations: { type: integer }
        seconds: { type: number }
        group: { type: string }
        label: { type: string }
        critical: { type: boolean }

    GraphEdge:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        when:
          type: string
          enum: ["true", "false", "body", "after"]
          description: Set on the two edges leaving a condition (`true`, `false`) or a loop (`body`, `after`).

    ScenarioGraph:
      type: object
      required: [start, nodes, edges]
      description: |
        What the canvas, the imports and the text editor all produce. A graph ends
        in `end` nodes and every node must be reachable from `start`.
      properties:
        start: { type: string }
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"

    ValidateGraphRequest:
      type: object
      required: [graph]
      properties:
        graph:
          $ref: "#/components/schemas/ScenarioGraph"

    UpdateScenarioRequest:
      type: object
      description: Anything left out stays as it is.
      properties:
        name: { type: string, maxLength: 120 }
        script:
          type: string
          description: |
            Refused with `409` on a scenario whose `mode` is `graph`: that
            script is generated, and editing the graph is what changes it.
        graph:
          allOf:
            - $ref: "#/components/schemas/ScenarioGraph"
          description: |
            Replaces the graph of a scenario whose `mode` is `graph`. The script
            is generated from it and a **new version** holds both. Refused with
            `409` on a scenario written as code (there is no conversion from code
            to a graph) and when sent together with a `script`.
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"

    ScenarioVersion:
      type: object
      required: [version, script, default_profile, default_params, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        script: { type: string }
        default_profile:
          $ref: "#/components/schemas/ProfileKind"
        default_params:
          $ref: "#/components/schemas/ProfileParams"
        created_by:
          type: string
          format: uuid
          description: Absent once the person who wrote it has been removed.
        created_at: { type: string, format: date-time }

    ScenarioVersionListResponse:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioVersion"

    # The rule a scenario imposes, as distinct from Threshold below, which is
    # k6's verdict on it for one run.
    ThresholdRule:
      type: object
      required: [id, metric, expression]
      properties:
        id: { type: string, format: uuid }
        metric:
          type: string
          maxLength: 200
          description: k6's tagged syntax is accepted, e.g. `http_req_duration{name:POST /login}`.
        expression: { type: string, maxLength: 120 }
      example:
        id: 7a1f1e6e-0000-4000-8000-000000000001
        metric: http_req_duration{name:POST /login}
        expression: p(95)<300

    ThresholdListResponse:
      type: object
      required: [thresholds]
      properties:
        thresholds:
          type: array
          items:
            $ref: "#/components/schemas/ThresholdRule"

    CreateThresholdRequest:
      type: object
      required: [metric, expression]
      properties:
        metric: { type: string, maxLength: 200 }
        expression: { type: string, maxLength: 120 }

    UpdateThresholdRequest:
      type: object
      description: Anything left out stays as it is.
      properties:
        metric: { type: string, maxLength: 200 }
        expression: { type: string, maxLength: 120 }

    MeResponse:
      type: object
      required: [user, organization, organizations]
      properties:
        user:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid }
            name:
              type: string
              description: As the identity provider gave it. May be empty.
            email: { type: string, format: email }
        organization:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        organizations:
          type: array
          description: |
            Every organization the person belongs to, the current one included,
            oldest first.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    SwitchOrganizationRequest:
      type: object
      required: [organization_id]
      properties:
        organization_id: { type: string, format: uuid }

    CapabilityRow:
      type: object
      required: [id, label]
      properties:
        id: { type: string, example: run_test }
        label: { type: string, example: Trigger a run }

    RoleCapabilities:
      type: object
      required: [role, capabilities]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        capabilities:
          type: array
          description: The ids of the capabilities this role holds.
          items: { type: string }

    RolesResponse:
      type: object
      required: [capabilities, roles]
      properties:
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityRow"
        roles:
          type: array
          description: Least able first.
          items:
            $ref: "#/components/schemas/RoleCapabilities"

    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/Role"

    Invitation:
      type: object
      required: [id, email, role, state, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/Role"
        invited_by:
          type: string
          format: uuid
          description: Absent when the person who invited has since left.
        state:
          type: string
          description: Used and revoked invitations are not listed.
          enum: [pending, expired]
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    InvitationListResponse:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    InvitationCreatedResponse:
      type: object
      required: [invitation, token]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: |
            The secret in the invitation link, shown this once. Only its hash is
            stored, so it cannot be read back.

    MemberAddedResponse:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }

    InvitationPreview:
      type: object
      required: [organization_name, project_name, email, role, state, expires_at]
      properties:
        organization_name: { type: string }
        project_name: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/Role"
        state:
          type: string
          enum: [pending, accepted, revoked, expired]
        expires_at: { type: string, format: date-time }

    InvitationAcceptedResponse:
      type: object
      required: [organization_id, project_id]
      properties:
        organization_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }

    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: string
            enum: [github, google]

    ProfileKind:
      type: string
      enum: [smoke, load, stress, spike, soak]

    ProfileParams:
      type: object
      description: The shape of the load, in whole seconds. The total duration must be at least one second.
      required: [target_vus, ramp_up_s, plateau_s, ramp_down_s]
      properties:
        target_vus: { type: integer, minimum: 1 }
        ramp_up_s: { type: integer, minimum: 0 }
        plateau_s: { type: integer, minimum: 0 }
        ramp_down_s: { type: integer, minimum: 0 }

    EnqueueRunRequest:
      type: object
      required: [scenario_id, environment_id, profile]
      properties:
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
      example:
        scenario_id: 00000000-0000-4000-8000-000000000003
        environment_id: 00000000-0000-4000-8000-000000000004
        profile: smoke

    EnqueueRunResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/RunStatus"

    CancelRunResponse:
      type: object
      required: [id, status, outcome]
      properties:
        id: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/RunStatus"
        outcome:
          type: string
          description: |
            `cancelled` when the run had not started and is now over.
            `cancellation_requested` when a generator is running and has been
            asked to stop: the worker executing it writes the ending.
          enum: [cancelled, cancellation_requested]

    StopAllResponse:
      type: object
      required: [cancelled, asked_to_stop]
      properties:
        cancelled:
          type: integer
          description: How many queued runs were cancelled outright.
        asked_to_stop:
          type: integer
          description: |
            How many running runs were asked to stop. Each is ended by the
            worker executing it, once it has destroyed the container.

    Usage:
      type: object
      description: |
        What was moved over a period, measured twice.

        The `egress`/`ingress` pair was counted on the wire by the proxy every
        run's traffic goes through — TLS records, headers and all — which is
        what an infrastructure bill is made of. The `data_sent`/`data_received`
        pair is what the generators themselves reported. The second is always
        the smaller, and their difference is the overhead this installation
        pays.

        Still missing from both, and worth knowing before either is priced: the
        TCP and IP headers of every packet, retransmissions, and the proxy's own
        DNS queries. Those live below the socket.
      required:
        - from
        - to
        - egress_bytes
        - ingress_bytes
        - data_sent_bytes
        - data_received_bytes
        - runs
        - unmeasured_runs
      properties:
        from:
          type: string
          format: date-time
          description: The first instant of the period, included.
        to:
          type: string
          format: date-time
          description: The first instant of the next period, excluded.
        egress_bytes:
          type: integer
          format: int64
          description: What left for the targets, counted on the wire.
        ingress_bytes:
          type: integer
          format: int64
          description: What came back, counted on the wire.
        data_sent_bytes:
          type: integer
          format: int64
          description: What the generators reported sending.
        data_received_bytes:
          type: integer
          format: int64
          description: What the generators reported receiving.
        runs:
          type: integer
          description: Runs that ended inside the period.
        unmeasured_runs:
          type: integer
          description: |
            How many of those nobody could measure — a summary whose counters
            could not be believed, or a proxy whose totals could not be read.
            Their volumes count as zero, which is why this number travels with
            the total: a figure with no idea how much of it is missing is a
            figure nobody can price.

    AuditEntry:
      type: object
      description: One line of a project's journal.
      required: [action, outcome, target_type, details, at]
      properties:
        action:
          type: string
          description: |
            What was attempted. The values are stored, so they do not change.
          enum:
            - run.queued
            - run.refused
            - run.cancelled
            - runs.stopped
            - target.verified
            - target.approved
            - member.role_changed
            - member.removed
            - member.invited
            - member.joined
            - invitation.revoked
        outcome:
          type: string
          description: Whether it was allowed.
          enum: [allowed, refused]
        actor_id:
          type: string
          format: uuid
          description: |
            Who did it. Absent when Ballast itself acted with nobody behind it.
        project_id:
          type: string
          format: uuid
          description: |
            The project concerned. Absent for an action on the organization.
        target_type:
          type: string
          enum: [run, environment, membership, invitation, organization]
        target_id:
          type: string
          format: uuid
          description: Absent when the action has no single target.
        details:
          type: object
          additionalProperties: { type: string }
          description: |
            A small set of keys chosen per action — a refusal's `reason`, an
            approval's `host`, a run's `profile`. Never a secret, a token or a
            header.
          example:
            reason: the target environment has not been verified
            environment_id: 2c6f0f0e-2b64-4e3f-9b1a-9a9d2f8a1e55
        at: { type: string, format: date-time }

    AuditListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"

    LogLine:
      type: object
      description: One line a run's generator wrote.
      required: [seq, stream, message, at]
      properties:
        seq:
          type: integer
          format: int64
          description: |
            Where the line falls in the run's output. One counter is shared
            between the two streams, so the order is the order the generator
            produced them. It is also the event's id, which is what a
            reconnection resumes from.
        stream:
          type: string
          enum: [stdout, stderr]
        message:
          type: string
          description: The line, with credentials replaced by `[redacted]`.
          example: "  ✓ status is 200"
        at: { type: string, format: date-time }

    RunEnded:
      type: object
      description: The last event of a log stream.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/RunStatus"

    RunStatus:
      type: string
      description: "`orphaned` is not terminal: the worker died mid-run and the run still has to be cleaned up."
      enum: [queued, running, passed, failed, errored, timeout, cancelled, rejected, skipped, orphaned]

    ProjectStatsResponse:
      type: object
      required: [days, from, to, pass_rate, failed_runs, total_runs, avg_duration_s, p95_ms]
      properties:
        days: { type: integer, minimum: 1, maximum: 90 }
        from:
          type: string
          format: date-time
          description: The start of the current window, a UTC midnight. Included.
        to:
          type: string
          format: date-time
          description: The end of the current window, a UTC midnight. Excluded.
        pass_rate:
          allOf:
            - $ref: "#/components/schemas/StatsMeasure"
          description: A ratio between 0 and 1. `change` is in percentage points.
        failed_runs:
          allOf:
            - $ref: "#/components/schemas/StatsMeasure"
          description: A count of runs. `change` is the difference in runs.
        total_runs:
          allOf:
            - $ref: "#/components/schemas/StatsMeasure"
          description: A count of runs. `change` is a percentage.
        avg_duration_s:
          allOf:
            - $ref: "#/components/schemas/StatsMeasure"
          description: Seconds. `change` is the difference in seconds.
        p95_ms:
          allOf:
            - $ref: "#/components/schemas/StatsMeasure"
          description: Milliseconds. `change` is the difference in milliseconds.

    StatsMeasure:
      type: object
      required: [value, previous, change, series]
      properties:
        value:
          type: [number, "null"]
          description: Over the current window. Null when there is nothing to say.
        previous:
          type: [number, "null"]
          description: The same figure over the window before.
        change:
          type: [number, "null"]
          description: How `value` moved from `previous`. Null when either is.
        series:
          type: array
          description: A point for each day of the current window, the oldest first.
          items:
            type: [number, "null"]

    RunListResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next:
          type: string
          description: Present when an older page follows. Pass it back as `before`.
        prev:
          type: string
          description: Present when a newer page exists. Pass it back as `after`.

    RunSummary:
      type: object
      description: A run as a list shows it. No metrics and no verdicts; see `GET /runs/{id}`.
      required:
        - id
        - number
        - project_id
        - scenario_id
        - environment_id
        - scenario_version
        - profile
        - params
        - status
        - created_at
      properties:
        id: { type: string, format: uuid }
        number:
          type: integer
          minimum: 1
          description: How the run is spoken of within its project, #1482. Never reused.
        project_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        scenario_version: { type: integer }
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
        status:
          $ref: "#/components/schemas/RunStatus"
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        triggered_by:
          type: string
          description: The name of who started the run. Absent when nobody did, or when the person has since been removed.
        p95_ms:
          type: number
          description: The 95th percentile of the request duration, in milliseconds, as k6 reported it. Absent while the run has no results.
        error_rate:
          type: number
          minimum: 0
          maximum: 1
          description: The share of requests that failed, as a ratio. Absent while the run has no results.

    RunResponse:
      type: object
      required:
        - id
        - number
        - project_id
        - scenario_id
        - environment_id
        - scenario_version
        - profile
        - params
        - status
        - created_at
        - metrics
        - thresholds
      properties:
        id: { type: string, format: uuid }
        number:
          type: integer
          minimum: 1
          description: How the run is spoken of within its project, #1482. Never reused.
        project_id: { type: string, format: uuid }
        triggered_by:
          type: string
          description: The name of who started the run. Absent when nobody did, or when the person has since been removed.
        scenario_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        scenario_version:
          type: integer
          description: The version of the scenario that was run, frozen on the run.
        profile:
          $ref: "#/components/schemas/ProfileKind"
        params:
          $ref: "#/components/schemas/ProfileParams"
        status:
          $ref: "#/components/schemas/RunStatus"
        error_message:
          type: string
          description: Why the run errored, when it did.
        cancel_requested_at:
          type: string
          format: date-time
          description: |
            When somebody asked this run to stop. Set as soon as the request is
            recorded, which is before the run has actually stopped: a client
            watching a cancellation of a running run waits for `status` to
            become `cancelled`.
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        thresholds:
          type: array
          items:
            $ref: "#/components/schemas/Threshold"

    Metric:
      type: object
      description: One number k6 measured.
      required: [metric, stat, value]
      properties:
        metric:
          type: string
          example: http_req_duration
        tag:
          type: string
          description: The sub-metric's tag selector, absent for the metric itself.
          example: "expected_response:true"
        stat:
          type: string
          description: avg, min, med, max, p(90), p(95), p(99) for a trend; rate, count… otherwise.
          example: p(95)
        value:
          type: number
          description: Milliseconds for durations, a ratio between 0 and 1 for rates.

    Threshold:
      type: object
      description: k6's verdict on one rule of the scenario.
      required: [metric, expression, passed]
      properties:
        metric:
          type: string
          example: http_req_duration
        expression:
          type: string
          example: p(95)<2000
        passed:
          type: boolean

    AllowedWindow:
      type: object
      description: |
        The stretch of the day a target accepts load, read in its own timezone. A
        `start` after an `end` crosses midnight: `22:00` to `06:00` is the night.

        `start` is inclusive and `end` is not. A run must fit **entirely** inside
        the window: one asked for while it is shut is refused with `403`, and so
        is one that would still be generating load after it closes. The check is
        made again before the generator starts, because a run accepted inside the
        window can wait in the queue until there is no longer room for it.

        The hours are real hours, not clock minutes: on the night the clocks go
        forward, a window open until `04:00` holds one hour less than it reads.
      required: [start, end, timezone]
      properties:
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "22:00"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "06:00"
        timezone:
          type: string
          description: An IANA name. The window is wall-clock time there, daylight saving included.
          example: Europe/Paris
        days:
          type: array
          description: |
            Narrows the window to some days of the week, read in `timezone`. Left
            out, every day; an empty list is refused with `400`, since a window on
            no day would refuse every run.

            A window that crosses midnight **belongs to the day it starts**:
            `mon`–`fri` with `22:00`–`04:00` is five nights, and Friday's ends on
            Saturday morning. A Sunday morning is therefore outside it, because
            Saturday has no night of its own.
          uniqueItems: true
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
          example: [mon, tue, wed, thu, fri]

    Environment:
      type: object
      description: A target a project may be allowed to send load to.
      required:
        - id
        - name
        - base_url
        - verification_status
        - max_vus
        - max_duration_s
        - created_at
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          maxLength: 120
          example: staging
        base_url:
          type: string
          format: uri
          description: |
            What a scenario reads as `__ENV.BASE_URL`. `http` or `https`, a host,
            and no credentials, query string or fragment.
          example: https://staging.example.test
        verification_status:
          type: string
          enum: [pending, proof_ok, verified, verification_failed]
          description: |
            Only `verified` lets load through. `proof_ok` means the challenge was
            served and nobody has approved it yet, which is deliberately not
            enough.
        max_vus:
          type: integer
          minimum: 1
          maximum: 100000
        max_duration_s:
          type: integer
          minimum: 1
          maximum: 86400
        allowed_window:
          $ref: "#/components/schemas/AllowedWindow"
        verification_checked_at:
          type: string
          format: date-time
          description: |
            When somebody last asked Ballast to fetch the challenge, whether or not
            it was served. Absent until the first attempt.
        created_at: { type: string, format: date-time }

    EnvironmentListResponse:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          items:
            $ref: "#/components/schemas/Environment"

    CreateEnvironmentRequest:
      type: object
      required: [name, base_url, max_vus, max_duration_s]
      properties:
        name:
          type: string
          maxLength: 120
          example: staging
        base_url:
          type: string
          format: uri
          example: https://staging.example.test
        max_vus:
          type: integer
          minimum: 1
          maximum: 100000
          example: 50
        max_duration_s:
          type: integer
          minimum: 1
          maximum: 86400
          example: 600
        allowed_window:
          $ref: "#/components/schemas/AllowedWindow"

    UpdateEnvironmentRequest:
      type: object
      description: |
        Anything left out stays as it is. `allowed_window` sent as `null` removes
        the window; left out, it is untouched.
      properties:
        name: { type: string, maxLength: 120 }
        base_url: { type: string, format: uri }
        max_vus: { type: integer, minimum: 1, maximum: 100000 }
        max_duration_s: { type: integer, minimum: 1, maximum: 86400 }
        allowed_window:
          oneOf:
            - $ref: "#/components/schemas/AllowedWindow"
            - type: "null"

    Secret:
      type: object
      description: |
        A stored credential, as far as the API will ever describe one: its key and
        its dates. There is no field for the value, and no endpoint returns it.
      required: [id, key, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          example: API_TOKEN
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When the value was last replaced.

    SecretListResponse:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/Secret"

    SetSecretRequest:
      type: object
      description: The one value that travels into Ballast and never back out.
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Encrypted at rest with AES-256-GCM. No control characters: it becomes
            one entry of the generator's environment.
          example: a-token-for-the-test-account

    VerificationFailed:
      type: object
      description: The answer to a verification that proved nothing.
      required: [error, failure]
      properties:
        error: { type: string }
        failure:
          type: object
          required: [searched, reason]
          properties:
            searched:
              type: string
              description: |
                Where the challenge was looked for, with `<token>` where the token
                is. The person fixing it has the token in front of them, in the
                challenge; an error body is copied into tickets and chat, and the
                token is what keeps anybody from serving a file for a target they
                do not own.
              example: https://staging.example.test/.well-known/ballast-<token>
            status:
              type: integer
              description: |
                The HTTP status the target answered. Absent when it answered
                nothing: unreachable, resolving somewhere Ballast refuses, or
                redirecting away.
            bytes:
              type: integer
              description: How large the file it served was, when one was read.
            too_long:
              type: boolean
              description: The file was longer than Ballast reads, which is 4 KiB.
            reason:
              type: string
              description: Ballast's own sentence for what went wrong.

    VerificationChallenge:
      type: object
      description: |
        What a target has to serve for Ballast to believe somebody owns it, and
        where that stands.
      required: [verification_status, token, url]
      properties:
        verification_status:
          type: string
          enum: [pending, proof_ok, verified, verification_failed]
        token:
          type: string
          description: |
            43 characters of base64url. The file must hold this and nothing else;
            a trailing newline is tolerated.
          example: 7sJ2kQ9vXr4mN1pZ8tLbYw3hG6fD0aEcUiOqRsTuVwY
        url:
          type: string
          format: uri
          description: Exactly where Ballast will look, at the root of the origin.
          example: https://staging.example.test/.well-known/ballast-7sJ2kQ9vXr4mN1pZ8tLbYw3hG6fD0aEcUiOqRsTuVwY
        verified_at:
          type: string
          format: date-time
          description: Absent until an administrator approves the target.
        verified_by:
          type: string
          format: uuid
          description: Who approved it. Absent until then.
        verified_by_name:
          type: string
          description: |
            Who approved it, as a screen should say them: the name they signed in
            with, or their address when they gave none. Absent until approval.
        checked_at:
          type: string
          format: date-time
          description: |
            When the challenge was last fetched, whatever came of it. Absent until
            somebody first asks.
