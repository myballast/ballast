version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/adapter/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/adapter/postgres/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        # Without these the generated code speaks pgtype, and every repository
        # would spend its lines converting to and from it.
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.int2
            nullable: true
            go_type:
              type: int16
              pointer: true
