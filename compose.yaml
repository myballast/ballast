# Local development dependencies. Credentials here are development-only.
name: ballast

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Owner role: runs the migrations and owns the tables.
      # The application connects as ballast_app, created by the init script below.
      POSTGRES_USER: ballast
      POSTGRES_PASSWORD: ballast
      POSTGRES_DB: ballast
      # Read by the init script, which hands it to ops/sql/00-app-role.sql.
      BALLAST_APP_PASSWORD: ballast_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./ops/sql:/ops/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballast -d ballast"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Object storage for a run's artifacts, S3-compatible. The code only speaks S3
  # (internal/adapter/storage/s3), so this can be replaced by R2, a Railway
  # bucket or anything else that answers the same protocol.
  #
  # The official images are gone: quay.io/minio/minio and minio/minio on Docker
  # Hub both refuse every tag. This is Chainguard's build, the one MinIO image
  # still pullable without an account. It only publishes `latest`, so it is
  # pinned by digest: a development database that changes under you is a bad
  # morning, and a new MinIO release is not a reason to have one.
  #
  # No healthcheck, on purpose: the image holds the minio binary and nothing
  # else — no shell, no curl, no mc. Whoever needs it ready (the integration
  # tests) waits for it, see internal/adapter/storage/s3.
  #
  # Both ports are published on the loopback only. Credentials are for
  # development; production has its own, and neither port is reachable there.
  minio:
    image: chainguard/minio:latest@sha256:268d68a2a3b6fc65f905a61f84d7eab6345ce6bff14f551e2b028ec31e6a1341
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ballast
      MINIO_ROOT_PASSWORD: ballastballast
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
