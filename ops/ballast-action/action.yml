name: Ballast load test
description: Launch a load test run on Ballast, follow it, and fail the job when a threshold is breached.
author: Ballast
branding:
  icon: activity
  color: purple

inputs:
  token:
    description: An API token of the project, from its "CI tokens" page. Give it a secret, never a value written in the workflow.
    required: true
  url:
    description: The address of your Ballast, for example https://ballast.example.com.
    required: true
  scenario:
    description: The identifier of the scenario to run (a UUID).
    required: true
  environment:
    description: The identifier of the environment to run against (a UUID).
    required: true
  profile:
    description: The load profile, for example smoke, load, stress, spike or soak.
    required: true
  timeout:
    description: How long to give the run from its launch, for example 90m. When it is up the run is asked to stop and the step fails. Default is two hours.
    required: false
    default: ""
  allow-no-threshold:
    description: Accept a run that judged no threshold. Without it such a run fails the step, because it measured nothing against a rule.
    required: false
    default: "false"
  no-fail-on-breach:
    description: Do not fail the step when a threshold is breached. The breach is still shown and still in the verdict output.
    required: false
    default: "false"
  version:
    description: The version of the ballast command to use, for example v1.2.3. Default is the one this version of the Action was released with.
    required: false
    default: ""

outputs:
  run-id:
    description: The identifier of the run, empty when none was launched.
    value: ${{ steps.run.outputs.run-id }}
  status:
    description: The last known status of the run.
    value: ${{ steps.run.outputs.status }}
  verdict:
    description: met, breached or none. Empty when the run did not finish.
    value: ${{ steps.run.outputs.verdict }}
  url:
    description: The address of the run's page.
    value: ${{ steps.run.outputs.url }}
  exit-code:
    description: The code the command left with, 0, 1 or 2.
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install.sh"
      env:
        BALLAST_VERSION: ${{ inputs.version }}

    - id: run
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/run.sh"
      env:
        BALLAST_BIN: ${{ steps.install.outputs.bin }}
        BALLAST_TOKEN: ${{ inputs.token }}
        BALLAST_URL: ${{ inputs.url }}
        BALLAST_ARG_SCENARIO: ${{ inputs.scenario }}
        BALLAST_ARG_ENVIRONMENT: ${{ inputs.environment }}
        BALLAST_ARG_PROFILE: ${{ inputs.profile }}
        BALLAST_ARG_TIMEOUT: ${{ inputs.timeout }}
        BALLAST_ARG_ALLOW_NO_THRESHOLD: ${{ inputs.allow-no-threshold }}
        BALLAST_ARG_NO_FAIL_ON_BREACH: ${{ inputs.no-fail-on-breach }}
