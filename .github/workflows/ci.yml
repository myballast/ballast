name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes an older run pointless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The pinned golangci-lint version lives in the Makefile, so local and CI
      # cannot drift apart. The first run on a cold cache compiles it.
      - run: make lint

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # eslint, then the colour-charter check.
      - run: npm run lint

      # `next typegen` first: the route types (PageProps, LayoutProps...) are
      # generated, and a fresh checkout does not have them.
      - run: npm run typecheck

      - run: npm test

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make test

      # The repository's own compose.yaml, not a services: block: service
      # containers start before the checkout and therefore cannot run
      # ops/sql/00-app-role.sql, through deploy/postgres/init. CI would then
      # connect as a superuser, and every Row-Level Security assertion would pass
      # vacuously. This is also the script production runs, so the role the
      # tests exercise (TestApplicationRoleIsLeastPrivileged and the isolation
      # suite) is the role that will be deployed.
      - run: make up

      # Acceptance criterion of #3: the schema must be reversible, not
      # merely creatable. A down migration that does not clean up is only
      # discovered when someone needs it.
      - name: Migrate up, down and up again
        run: make migrate && make migrate-down && make migrate

      - run: make test-int

      - name: Dump container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: make down
